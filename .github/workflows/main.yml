name: Windows RDP + Moonlight

on:
  workflow_dispatch:

jobs:
  windows-pc:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 0 `
            -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service TermService -Force

      - name: Create RDP account
        shell: powershell
        run: |
          $upper   = [char[]](65..90)
          $lower   = [char[]](97..122)
          $numbers = [char[]](48..57)
          $special = [char[]](33..47) + `
                     [char[]](58..64) + `
                     [char[]](91..96) + `
                     [char[]](123..126)

          $chars = @()

          $chars += $upper   | Get-Random -Count 4
          $chars += $lower   | Get-Random -Count 4
          $chars += $numbers | Get-Random -Count 4
          $chars += $special | Get-Random -Count 4

          $password = -join ($chars | Sort-Object { Get-Random })

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "RDP"
          }

          New-LocalUser `
            -Name "RDP" `
            -Password $securePassword `
            -AccountNeverExpires `
            -PasswordNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP"

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host "RDP account created."

      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i","`"$installer`"","/quiet","/norestart" `
            -Wait

          Remove-Item $installer -Force

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            Write-Error "Tailscale installation failed."
            exit 1
          }

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            Write-Error "Missing repository secret TAILSCALE_AUTH_KEY"
            exit 1
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale logout 2>$null

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="github-rdp-$env:GITHUB_RUN_ID" `
            --accept-dns=false

          Start-Sleep -Seconds 8

          Write-Host ""
          Write-Host "========== TAILSCALE STATUS =========="
          & $tailscale status

          Write-Host ""
          Write-Host "========== TAILSCALE IP =========="

          $tailscaleIP = $null

          for ($i = 0; $i -lt 20; $i++) {

            $ips = & $tailscale ip -4 2>$null

            foreach ($ip in $ips) {

              $ip = $ip.Trim()

              if ($ip -match '^100\.(\d{1,3}\.){2}\d{1,3}$') {
                $tailscaleIP = $ip
                break
              }
            }

            if ($tailscaleIP) {
              break
            }

            Start-Sleep -Seconds 3
          }

          if (-not $tailscaleIP) {
            Write-Error "Tailscale IPv4 was not assigned."
            exit 1
          }

          "TAILSCALE_IP=$tailscaleIP" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "======================================"
          Write-Host "RDP MACHINE TAILSCALE IP:"
          Write-Host "$tailscaleIP"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "Windows computer:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "GitHub runner user:"
          Write-Host $env:USERNAME

      - name: Verify RDP machine
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host " WINDOWS RDP MACHINE"
          Write-Host "======================================"

          Write-Host "Computer : $env:COMPUTERNAME"
          Write-Host "Runner   : $env:USERNAME"
          Write-Host "RDP user : RDP"
          Write-Host "TS IP    : $env:TAILSCALE_IP"

          Write-Host ""
          Write-Host "=== Tailscale adapter ==="

          Get-NetIPAddress `
            -AddressFamily IPv4 `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.IPAddress -eq $env:TAILSCALE_IP
            } |
            Format-Table IPAddress,InterfaceAlias

          Write-Host ""
          Write-Host "=== RDP listener ==="

          Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue |
            Format-Table LocalAddress,LocalPort,State,OwningProcess

          Write-Host ""
          Write-Host "=== Local RDP test ==="

          $test = Test-NetConnection `
            127.0.0.1 `
            -Port 3389

          if (-not $test.TcpTestSucceeded) {
            Write-Error "RDP is not listening on port 3389."
            exit 1
          }

          Write-Host "RDP is listening successfully."

      - name: Check GPU
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host " GPU INFORMATION"
          Write-Host "======================================"

          Get-CimInstance Win32_VideoController |
            Select-Object `
              Name,
              DriverVersion,
              VideoProcessor,
              AdapterRAM |
            Format-List

      - name: Install Sunshine
        shell: powershell
        run: |
          $version = "v2026.516.143833"

          $url = "https://github.com/LizardByte/Sunshine/releases/download/$version/Sunshine-Windows-AMD64-installer.exe"

          $installer = "$env:TEMP\Sunshine.exe"

          Write-Host "Downloading Sunshine..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/S" `
            -Wait

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          $sunshine = "C:\Program Files\Sunshine\sunshine.exe"

          if (-not (Test-Path $sunshine)) {
            Write-Error "Sunshine installation failed."
            exit 1
          }

          "SUNSHINE_EXE=$sunshine" >> $env:GITHUB_ENV

          Write-Host "Sunshine installed."

      - name: Configure Sunshine
        shell: powershell
        run: |
          $configDirectory = "C:\Program Files\Sunshine\config"

          New-Item `
            -ItemType Directory `
            -Path $configDirectory `
            -Force |
            Out-Null

          $configFile = "$configDirectory\sunshine.conf"

          @"
          sunshine_name = GitHub-Moonlight
          address_family = ipv4
          bind_address = $env:TAILSCALE_IP
          port = 47989
          origin_web_ui_allowed = wan
          csrf_allowed_origins = https://$env:TAILSCALE_IP:47990
          lan_encryption_mode = 1
          wan_encryption_mode = 1
          max_bitrate = 0
          minimum_fps_target = 30
          hevc_mode = 0
          av1_mode = 0
          "@ |
          Set-Content `
            -Path $configFile `
            -Encoding UTF8

          Write-Host "Sunshine configuration:"
          Get-Content $configFile

      - name: Configure Sunshine credentials
        shell: powershell
        run: |
          $bytes = New-Object byte[] 18

          [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)

          $password = [Convert]::ToBase64String($bytes)

          $password = $password.Replace("+","A")
          $password = $password.Replace("/","B")
          $password = $password.Replace("=","C")

          & $env:SUNSHINE_EXE `
            --creds `
            "moonlight" `
            "$password"

          "SUNSHINE_USER=moonlight" >> $env:GITHUB_ENV
          "SUNSHINE_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Configure Sunshine firewall
        shell: powershell
        run: |
          netsh advfirewall firewall delete rule `
            name="Sunshine-Tailscale-TCP" 2>$null

          netsh advfirewall firewall delete rule `
            name="Sunshine-Tailscale-UDP" 2>$null

          netsh advfirewall firewall add rule `
            name="Sunshine-Tailscale-TCP" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=47984,47989,47990,48010 `
            profile=any

          netsh advfirewall firewall add rule `
            name="Sunshine-Tailscale-UDP" `
            dir=in `
            action=allow `
            protocol=UDP `
            localport=47998,47999,48000,48002 `
            profile=any

      - name: Start Sunshine
        shell: powershell
        run: |
          $service = Get-Service `
            -Name "Sunshine" `
            -ErrorAction SilentlyContinue

          if ($service) {

            Set-Service `
              -Name "Sunshine" `
              -StartupType Automatic

            Start-Service `
              -Name "Sunshine" `
              -ErrorAction SilentlyContinue

            Start-Sleep -Seconds 10
          }

          if (-not (Get-Process sunshine -ErrorAction SilentlyContinue)) {

            Start-Process `
              -FilePath $env:SUNSHINE_EXE `
              -WorkingDirectory "C:\Program Files\Sunshine" `
              -WindowStyle Hidden

            Start-Sleep -Seconds 10
          }

          if (-not (Get-Process sunshine -ErrorAction SilentlyContinue)) {
            Write-Error "Sunshine did not start."
            exit 1
          }

          Write-Host "Sunshine is running."

      - name: Verify Sunshine
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host " SUNSHINE"
          Write-Host "======================================"

          Get-NetTCPConnection `
            -State Listen `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.LocalPort -in 47984,47989,47990,48010
            } |
            Format-Table LocalAddress,LocalPort,State

          Write-Host ""
          Write-Host "Testing Sunshine Web UI..."

          $test = Test-NetConnection `
            127.0.0.1 `
            -Port 47990

          if (-not $test.TcpTestSucceeded) {
            Write-Warning "Sunshine Web UI port 47990 is not reachable."
          }
          else {
            Write-Host "Sunshine Web UI is listening."
          }

      - name: Display connection information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "===================================================="
          Write-Host "             WINDOWS CLOUD PC READY"
          Write-Host "===================================================="
          Write-Host ""

          Write-Host "WINDOWS COMPUTER : $env:COMPUTERNAME"
          Write-Host "RUNNER USER      : $env:USERNAME"
          Write-Host ""

          Write-Host "TAILSCALE IP     : $env:TAILSCALE_IP"
          Write-Host ""

          Write-Host "================ RDP ================="
          Write-Host "Address          : $env:TAILSCALE_IP`:3389"
          Write-Host "Username         : RDP"
          Write-Host "Password         : $env:RDP_PASSWORD"
          Write-Host ""

          Write-Host "============== SUNSHINE ============="
          Write-Host "Web UI            : https://$env:TAILSCALE_IP`:47990"
          Write-Host "Username          : $env:SUNSHINE_USER"
          Write-Host "Password          : $env:SUNSHINE_PASSWORD"
          Write-Host ""

          Write-Host "============== MOONLIGHT ============"
          Write-Host "Add PC            : $env:TAILSCALE_IP"
          Write-Host ""

          Write-Host "IMPORTANT:"
          Write-Host "The Tailscale IP above belongs to this"
          Write-Host "Windows GitHub Actions runner."
          Write-Host "The RDP account does NOT receive another IP."
          Write-Host ""

          Write-Host "===================================================="

      - name: Keep Windows PC alive
        shell: powershell
        run: |
          while ($true) {

            if (-not (Get-Process sunshine -ErrorAction SilentlyContinue)) {

              Write-Warning "Sunshine stopped. Restarting..."

              Start-Process `
                -FilePath $env:SUNSHINE_EXE `
                -WorkingDirectory "C:\Program Files\Sunshine" `
                -WindowStyle Hidden

              Start-Sleep -Seconds 5
            }

            Write-Host ""
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')]"
            Write-Host "Windows PC active"
            Write-Host "Tailscale IP: $env:TAILSCALE_IP"

            Start-Sleep -Seconds 60
          }
