name: Windows RDP + Tailscale + B2 + StarDesk + Auto Game Persistence V5

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    env:
      RCLONE_DIR: C:\Rclone
      RCLONE_CONFIG: C:\Rclone\rclone.conf
      WORK_DIR: C:\RDP-PERSIST
      MANIFEST: C:\RDP-PERSIST\baseline.json

      RDP_USER: RDP
      RDP_HOME: C:\Users\RDP

    steps:

      # ============================================================
      # 1. PREPARE
      # ============================================================
      - name: Prepare directories
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force `
            -Path "$env:RCLONE_DIR" | Out-Null

          New-Item -ItemType Directory -Force `
            -Path "$env:WORK_DIR" | Out-Null

          Write-Host "=========================================="
          Write-Host "RDP PERSISTENCE V5"
          Write-Host "=========================================="
          Write-Host "User: $env:RDP_USER"
          Write-Host "Home: $env:RDP_HOME"

      # ============================================================
      # 2. INSTALL RCLONE
      # ============================================================
      - name: Install rclone
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $zip = "$env:TEMP\rclone.zip"
          $extract = "$env:TEMP\rclone-extract"

          Remove-Item "$zip" -Force -ErrorAction SilentlyContinue
          Remove-Item "$extract" -Recurse -Force -ErrorAction SilentlyContinue

          Invoke-WebRequest `
            -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" `
            -OutFile "$zip" `
            -UseBasicParsing

          if (-not (Test-Path "$zip")) {
            throw "rclone download failed"
          }

          Expand-Archive `
            -Path "$zip" `
            -DestinationPath "$extract" `
            -Force

          $exe = Get-ChildItem `
            -Path "$extract" `
            -Filter "rclone.exe" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $exe) {
            throw "rclone.exe not found"
          }

          Copy-Item `
            "$($exe.FullName)" `
            "$env:RCLONE_DIR\rclone.exe" `
            -Force

          & "$env:RCLONE_DIR\rclone.exe" version

          if ($LASTEXITCODE -ne 0) {
            throw "rclone test failed"
          }

          Write-Host "rclone OK."

      # ============================================================
      # 3. CONFIGURE B2
      # ============================================================
      - name: Configure Backblaze B2
        shell: powershell
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
        run: |
          $ErrorActionPreference = "Stop"

          $rclone = "$env:RCLONE_DIR\rclone.exe"

          Remove-Item `
            "$env:RCLONE_CONFIG" `
            -Force `
            -ErrorAction SilentlyContinue

          & $rclone config create b2remote s3 `
            provider Other `
            access_key_id "$env:B2_KEY_ID" `
            secret_access_key "$env:B2_APPLICATION_KEY" `
            endpoint "$env:B2_ENDPOINT" `
            --config "$env:RCLONE_CONFIG"

          if ($LASTEXITCODE -ne 0) {
            throw "B2 configuration failed"
          }

          Write-Host "B2 configured."

      # ============================================================
      # 4. TEST B2
      # ============================================================
      - name: Test B2
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Stop"

          & "$env:RCLONE_DIR\rclone.exe" lsd `
            "b2remote:$env:B2_BUCKET" `
            --config "$env:RCLONE_CONFIG"

          if ($LASTEXITCODE -ne 0) {
            throw "Cannot access B2 bucket"
          }

          Write-Host "B2 connection OK."

      # ============================================================
      # 5. CREATE RDP USER
      # ============================================================
      - name: Create RDP user
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $username = "$env:RDP_USER"

          $password = ConvertTo-SecureString `
            "$env:RDP_PASSWORD" `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name "$username" `
            -ErrorAction SilentlyContinue

          if ($user) {

            Set-LocalUser `
              -Name "$username" `
              -Password $password

          } else {

            New-LocalUser `
              -Name "$username" `
              -Password $password `
              -PasswordNeverExpires `
              -AccountNeverExpires `
              -UserMayNotChangePassword
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "$username" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "$username" `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user ready."

      # ============================================================
      # 6. ENABLE RDP
      # ============================================================
      - name: Enable RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Write-Host "RDP enabled."

      # ============================================================
      # 7. INSTALL STAR DESK
      # ============================================================
      - name: Install StarDesk
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=========================================="
          Write-Host "INSTALLING STAR DESK"
          Write-Host "=========================================="

          winget install `
            --id Stardesk.Stardesk `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity

          $code = $LASTEXITCODE

          Write-Host "StarDesk install exit code: $code"

          Start-Sleep -Seconds 10

          winget list `
            --id Stardesk.Stardesk `
            --exact

          Write-Host "StarDesk installation checked."

      # ============================================================
      # 8. RESTORE PREVIOUS APP LIST
      # ============================================================
      - name: Restore application list
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Continue"

          $rclone = "$env:RCLONE_DIR\rclone.exe"
          $appsFile = "$env:WORK_DIR\apps.json"

          Remove-Item `
            "$appsFile" `
            -Force `
            -ErrorAction SilentlyContinue

          & $rclone copyto `
            "b2remote:$env:B2_BUCKET/apps/apps.json" `
            "$appsFile" `
            --config "$env:RCLONE_CONFIG" `
            --retries 5 `
            --low-level-retries 10

          if (Test-Path "$appsFile") {

            $size = (Get-Item "$appsFile").Length

            Write-Host "apps.json restored."
            Write-Host "Size: $size bytes"

          } else {

            Write-Host "No previous apps.json."
          }

      # ============================================================
      # 9. RESTORE APPLICATIONS
      # ============================================================
      - name: Restore applications
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $appsFile = "$env:WORK_DIR\apps.json"

          if (-not (Test-Path "$appsFile")) {
            Write-Host "No app backup."
            exit 0
          }

          winget import `
            --import-file "$appsFile" `
            --accept-source-agreements `
            --accept-package-agreements `
            --ignore-unavailable

          Write-Host "winget restore exit code: $LASTEXITCODE"

      # ============================================================
      # 10. GAME / PROGRAM ROOTS
      #
      # Everything existing here BEFORE the baseline is ignored.
      # ============================================================
      - name: Define scan roots
        shell: powershell
        run: |
          $roots = @(
            "C:\Games",
            "D:\Games",
            "C:\XboxGames",
            "C:\Program Files",
            "C:\Program Files (x86)",
            "C:\ProgramData",
            "$env:RDP_HOME"
          )

          $roots |
            Set-Content `
              "$env:WORK_DIR\scan-roots.txt" `
              -Encoding UTF8

          Write-Host "Scan roots:"

          $roots |
            ForEach-Object {
              Write-Host " - $_"
            }

      # ============================================================
      # 11. RESTORE PREVIOUS NEW-GAME BACKUP
      # ============================================================
      - name: Restore previous new game data
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Continue"

          $rclone = "$env:RCLONE_DIR\rclone.exe"

          Write-Host "=========================================="
          Write-Host "RESTORING PREVIOUS NEW GAME DATA"
          Write-Host "=========================================="

          & $rclone copy `
            "b2remote:$env:B2_BUCKET/new-games" `
            "C:\" `
            --config "$env:RCLONE_CONFIG" `
            --retries 5 `
            --low-level-retries 10 `
            --transfers 4 `
            --checkers 8 `
            --stats 30s

          Write-Host "Restore finished."

      # ============================================================
      # 12. CREATE BASELINE
      #
      # Files present at this exact point are considered
      # pre-existing and WILL NOT be backed up.
      # ============================================================
      - name: Create initial baseline
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=========================================="
          Write-Host "CREATING INITIAL BASELINE"
          Write-Host "=========================================="

          $roots = Get-Content `
            "$env:WORK_DIR\scan-roots.txt"

          $items = @()

          foreach ($root in $roots) {

            if (-not (Test-Path "$root")) {
              Write-Host "SKIP: $root"
              continue
            }

            Write-Host "Scanning: $root"

            Get-ChildItem `
              -LiteralPath "$root" `
              -Recurse `
              -File `
              -Force `
              -ErrorAction SilentlyContinue |
            ForEach-Object {

              $items += [PSCustomObject]@{
                Path = $_.FullName
                Length = $_.Length
                LastWriteTimeUtc = $_.LastWriteTimeUtc.ToString("o")
              }
            }
          }

          $items |
            ConvertTo-Json -Depth 3 |
            Set-Content `
              "$env:MANIFEST" `
              -Encoding UTF8

          Write-Host ""
          Write-Host "BASELINE FILE COUNT: $($items.Count)"
          Write-Host "Baseline created."

      # ============================================================
      # 13. TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          choco install tailscale -y --no-progress

          Start-Sleep -Seconds 10

          Write-Host "Tailscale installed."

      # ============================================================
      # 14. CONNECT TAILSCALE
      # ============================================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path "$tailscale")) {

            $cmd = Get-Command `
              tailscale.exe `
              -ErrorAction SilentlyContinue

            if ($cmd) {
              $tailscale = $cmd.Source
            }
          }

          if (-not (Test-Path "$tailscale")) {
            throw "tailscale.exe not found"
          }

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp"

          Start-Sleep -Seconds 10

          Write-Host ""
          Write-Host "TAILSCALE STATUS"
          & $tailscale status

          Write-Host ""
          Write-Host "TAILSCALE IPv4"
          & $tailscale ip -4

      # ============================================================
      # 15. AUTO DETECT + BACKUP
      #
      # New file       -> upload
      # Changed file   -> upload
      # Unchanged file -> ignore
      #
      # Scan interval: 5 minutes
      # ============================================================
      - name: Auto detect and backup new games
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Continue"

          $rclone = "$env:RCLONE_DIR\rclone.exe"

          $remote = `
            "b2remote:$env:B2_BUCKET/new-games"

          $roots = Get-Content `
            "$env:WORK_DIR\scan-roots.txt"

          $endTime = (Get-Date).AddMinutes(325)

          $iteration = 0

          while ((Get-Date) -lt $endTime) {

            $iteration++

            Write-Host ""
            Write-Host "=========================================="
            Write-Host "AUTO SCAN #$iteration"
            Write-Host (Get-Date)
            Write-Host "=========================================="

            # ------------------------------------------------------
            # Load baseline
            # ------------------------------------------------------

            $baseline = @{}

            if (Test-Path "$env:MANIFEST") {

              try {

                $old = Get-Content `
                  "$env:MANIFEST" `
                  -Raw |
                  ConvertFrom-Json

                foreach ($item in $old) {

                  $baseline[$item.Path] = `
                    "$($item.Length)|$($item.LastWriteTimeUtc)"
                }

              } catch {

                Write-Warning "Could not read baseline."
              }
            }

            $current = @()

            # ------------------------------------------------------
            # Scan every root
            # ------------------------------------------------------

            foreach ($root in $roots) {

              if (-not (Test-Path "$root")) {
                continue
              }

              Write-Host "Scanning: $root"

              Get-ChildItem `
                -LiteralPath "$root" `
                -Recurse `
                -File `
                -Force `
                -ErrorAction SilentlyContinue |
              ForEach-Object {

                $signature = `
                  "$($_.Length)|$($_.LastWriteTimeUtc.ToString('o'))"

                $current += [PSCustomObject]@{
                  Path = $_.FullName
                  Length = $_.Length
                  LastWriteTimeUtc = $_.LastWriteTimeUtc.ToString("o")
                }

                $oldSignature = `
                  $baseline[$_.FullName]

                # --------------------------------------------------
                # NEW OR CHANGED
                # --------------------------------------------------

                if (
                  $null -eq $oldSignature -or
                  $oldSignature -ne $signature
                ) {

                  $fullPath = $_.FullName

                  # -----------------------------------------------
                  # C: drive
                  # -----------------------------------------------

                  if (
                    $fullPath.StartsWith(
                      "C:\",
                      [System.StringComparison]::OrdinalIgnoreCase
                    )
                  ) {

                    $relative = `
                      $fullPath.Substring(3)

                    $destination = `
                      "$remote/C/$relative"

                  # -----------------------------------------------
                  # D: drive
                  # -----------------------------------------------

                  } elseif (
                    $fullPath.StartsWith(
                      "D:\",
                      [System.StringComparison]::OrdinalIgnoreCase
                    )
                  ) {

                    $relative = `
                      $fullPath.Substring(3)

                    $destination = `
                      "$remote/D/$relative"

                  } else {

                    return
                  }

                  Write-Host ""
                  Write-Host "NEW / CHANGED FILE:"
                  Write-Host "$fullPath"

                  & $rclone copyto `
                    "$fullPath" `
                    "$destination" `
                    --config "$env:RCLONE_CONFIG" `
                    --retries 3 `
                    --low-level-retries 5 `
                    --stats 5s

                  if ($LASTEXITCODE -eq 0) {

                    Write-Host "BACKUP SUCCESS"

                  } else {

                    Write-Warning `
                      "BACKUP FAILED: $fullPath"
                  }
                }
              }
            }

            # ------------------------------------------------------
            # Update baseline
            # ------------------------------------------------------

            $current |
              ConvertTo-Json -Depth 3 |
              Set-Content `
                "$env:MANIFEST" `
                -Encoding UTF8

            Write-Host ""
            Write-Host "FILES SCANNED: $($current.Count)"

            # ------------------------------------------------------
            # Wait 5 minutes
            # ------------------------------------------------------

            $nextScan = (Get-Date).AddMinutes(5)

            while (
              (Get-Date) -lt $nextScan -and
              (Get-Date) -lt $endTime
            ) {

              Start-Sleep -Seconds 10
            }
          }

          Write-Host ""
          Write-Host "AUTO BACKUP FINISHED."

      # ============================================================
      # 16. FINAL SCAN
      # ============================================================
      - name: Final game backup
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Continue"

          $rclone = "$env:RCLONE_DIR\rclone.exe"

          $remote = `
            "b2remote:$env:B2_BUCKET/new-games"

          $roots = Get-Content `
            "$env:WORK_DIR\scan-roots.txt"

          Write-Host "=========================================="
          Write-Host "FINAL GAME SCAN"
          Write-Host "=========================================="

          $baseline = @{}

          if (Test-Path "$env:MANIFEST") {

            try {

              $old = Get-Content `
                "$env:MANIFEST" `
                -Raw |
                ConvertFrom-Json

              foreach ($item in $old) {

                $baseline[$item.Path] = `
                  "$($item.Length)|$($item.LastWriteTimeUtc)"
              }

            } catch {}
          }

          foreach ($root in $roots) {

            if (-not (Test-Path "$root")) {
              continue
            }

            Write-Host "Final scan: $root"

            Get-ChildItem `
              -LiteralPath "$root" `
              -Recurse `
              -File `
              -Force `
              -ErrorAction SilentlyContinue |
            ForEach-Object {

              $signature = `
                "$($_.Length)|$($_.LastWriteTimeUtc.ToString('o'))"

              if (
                $null -eq $baseline[$_.FullName] -or
                $baseline[$_.FullName] -ne $signature
              ) {

                if (
                  $_.FullName.StartsWith(
                    "C:\",
                    [System.StringComparison]::OrdinalIgnoreCase
                  )
                ) {

                  $relative = `
                    $_.FullName.Substring(3)

                  $destination = `
                    "$remote/C/$relative"

                } elseif (
                  $_.FullName.StartsWith(
                    "D:\",
                    [System.StringComparison]::OrdinalIgnoreCase
                  )
                ) {

                  $relative = `
                    $_.FullName.Substring(3)

                  $destination = `
                    "$remote/D/$relative"

                } else {

                  return
                }

                Write-Host "FINAL BACKUP:"
                Write-Host $_.FullName

                & $rclone copyto `
                  "$($_.FullName)" `
                  "$destination" `
                  --config "$env:RCLONE_CONFIG" `
                  --retries 5 `
                  --low-level-retries 10 `
                  --stats 10s
              }
            }
          }

          Write-Host "Final backup complete."

      # ============================================================
      # 17. VERIFY B2
      # ============================================================
      - name: Verify B2
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Continue"

          $rclone = "$env:RCLONE_DIR\rclone.exe"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "B2 BACKUP SIZE"
          Write-Host "=========================================="

          & $rclone size `
            "b2remote:$env:B2_BUCKET/new-games" `
            --config "$env:RCLONE_CONFIG"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "APPLICATION BACKUP"
          Write-Host "=========================================="

          & $rclone size `
            "b2remote:$env:B2_BUCKET/apps" `
            --config "$env:RCLONE_CONFIG"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "WORKFLOW COMPLETE"
          Write-Host "=========================================="
