name: Windows RDP + Tailscale + B2 + StarDesk + Auto Game Persistence V6

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    env:
      RCLONE_DIR: C:\Rclone
      RCLONE_CONFIG: C:\Rclone\rclone.conf
      WORK_DIR: C:\RDP-PERSIST
      MANIFEST: C:\RDP-PERSIST\baseline.json

      RDP_USER: RDP
      RDP_HOME: C:\Users\RDP

    steps:

      # =========================================================
      # 1. PREPARE
      # =========================================================

      - name: Prepare directories
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force `
            -Path "$env:RCLONE_DIR" | Out-Null

          New-Item -ItemType Directory -Force `
            -Path "$env:WORK_DIR" | Out-Null

          Write-Host "=========================================="
          Write-Host "RDP PERSISTENCE V6"
          Write-Host "=========================================="
          Write-Host "RDP USER : $env:RDP_USER"
          Write-Host "RDP HOME : $env:RDP_HOME"


      # =========================================================
      # 2. INSTALL RCLONE
      # =========================================================

      - name: Install rclone
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $zip = "$env:TEMP\rclone.zip"
          $extract = "$env:TEMP\rclone-extract"

          Remove-Item "$zip" -Force -ErrorAction SilentlyContinue
          Remove-Item "$extract" -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Downloading rclone..."

          Invoke-WebRequest `
            -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" `
            -OutFile "$zip" `
            -UseBasicParsing

          if (-not (Test-Path "$zip")) {
            throw "rclone download failed"
          }

          Expand-Archive `
            -Path "$zip" `
            -DestinationPath "$extract" `
            -Force

          $exe = Get-ChildItem `
            -Path "$extract" `
            -Filter "rclone.exe" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $exe) {
            throw "rclone.exe not found"
          }

          Copy-Item `
            "$($exe.FullName)" `
            "$env:RCLONE_DIR\rclone.exe" `
            -Force

          & "$env:RCLONE_DIR\rclone.exe" version

          if ($LASTEXITCODE -ne 0) {
            throw "rclone test failed"
          }

          Write-Host "rclone installed successfully."


      # =========================================================
      # 3. CONFIGURE NATIVE BACKBLAZE B2
      #
      # V5 used S3 and caused:
      # S3 HeadObject 403 Forbidden
      #
      # V6 uses native B2 backend.
      # =========================================================

      - name: Configure Backblaze B2
        shell: powershell
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $rclone = "$env:RCLONE_DIR\rclone.exe"

          Remove-Item `
            "$env:RCLONE_CONFIG" `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "=========================================="
          Write-Host "CONFIGURING NATIVE BACKBLAZE B2"
          Write-Host "=========================================="

          & $rclone config create `
            b2remote `
            b2 `
            account "$env:B2_KEY_ID" `
            key "$env:B2_APPLICATION_KEY" `
            --config "$env:RCLONE_CONFIG"

          if ($LASTEXITCODE -ne 0) {
            throw "B2 configuration failed"
          }

          Write-Host "Native B2 remote created."


      # =========================================================
      # 4. TEST B2
      # =========================================================

      - name: Test B2 connection
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Stop"

          $rclone = "$env:RCLONE_DIR\rclone.exe"

          Write-Host "=========================================="
          Write-Host "TESTING B2"
          Write-Host "=========================================="

          Write-Host "Listing bucket..."

          & $rclone lsf `
            "b2remote:$env:B2_BUCKET" `
            --config "$env:RCLONE_CONFIG" `
            --max-depth 2

          if ($LASTEXITCODE -ne 0) {
            throw "Cannot access B2 bucket."
          }

          Write-Host "B2 connection OK."


      # =========================================================
      # 5. CREATE RDP USER
      # =========================================================

      - name: Create RDP user
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $username = "$env:RDP_USER"

          $password = ConvertTo-SecureString `
            "$env:RDP_PASSWORD" `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name "$username" `
            -ErrorAction SilentlyContinue

          if ($user) {

            Set-LocalUser `
              -Name "$username" `
              -Password $password

          }
          else {

            New-LocalUser `
              -Name "$username" `
              -Password $password `
              -PasswordNeverExpires `
              -AccountNeverExpires `
              -UserMayNotChangePassword
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "$username" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "$username" `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user ready."


      # =========================================================
      # 6. ENABLE RDP
      # =========================================================

      - name: Enable RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Write-Host "RDP enabled."


      # =========================================================
      # 7. DEFINE SCAN ROOTS
      #
      # These include:
      # - Games
      # - Xbox games
      # - Program Files
      # - ProgramData
      # - RDP profile
      #
      # Anything already present at baseline is considered
      # PRE-EXISTING and will NOT be uploaded.
      # =========================================================

      - name: Define scan roots
        shell: powershell
        run: |
          $roots = @(
            "C:\Games",
            "D:\Games",
            "C:\XboxGames",
            "C:\Program Files",
            "C:\Program Files (x86)",
            "C:\ProgramData",
            "$env:RDP_HOME\AppData\Local",
            "$env:RDP_HOME\AppData\Roaming",
            "$env:RDP_HOME\AppData\LocalLow",
            "$env:RDP_HOME\Documents",
            "$env:RDP_HOME\Saved Games"
          )

          $roots |
            Set-Content `
              "$env:WORK_DIR\scan-roots.txt" `
              -Encoding UTF8

          Write-Host "=========================================="
          Write-Host "SCAN ROOTS"
          Write-Host "=========================================="

          $roots |
            ForEach-Object {
              Write-Host " - $_"
            }


      # =========================================================
      # 8. RESTORE PREVIOUS GAME DATA
      #
      # IMPORTANT:
      #
      # new-games/C/Program Files/...
      #        -> C:\Program Files/...
      #
      # new-games/D/Games/...
      #        -> D:\Games/...
      #
      # No C:\C\ or C:\D\ problem.
      # =========================================================

      - name: Restore previous new game data
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Continue"

          $rclone = "$env:RCLONE_DIR\rclone.exe"

          Write-Host "=========================================="
          Write-Host "RESTORING PREVIOUS GAME DATA"
          Write-Host "=========================================="

          # -----------------------------
          # Restore C:
          # -----------------------------

          Write-Host ""
          Write-Host "Restoring C: data..."

          & $rclone copy `
            "b2remote:$env:B2_BUCKET/new-games/C" `
            "C:\" `
            --config "$env:RCLONE_CONFIG" `
            --retries 5 `
            --low-level-retries 10 `
            --transfers 8 `
            --checkers 16 `
            --fast-list `
            --stats 30s

          if ($LASTEXITCODE -ne 0) {
            Write-Warning "C: restore returned exit code $LASTEXITCODE"
          }
          else {
            Write-Host "C: restore completed."
          }


          # -----------------------------
          # Restore D:
          # -----------------------------

          if (Test-Path "D:\") {

            Write-Host ""
            Write-Host "Restoring D: data..."

            & $rclone copy `
              "b2remote:$env:B2_BUCKET/new-games/D" `
              "D:\" `
              --config "$env:RCLONE_CONFIG" `
              --retries 5 `
              --low-level-retries 10 `
              --transfers 8 `
              --checkers 16 `
              --fast-list `
              --stats 30s

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "D: restore returned exit code $LASTEXITCODE"
            }
            else {
              Write-Host "D: restore completed."
            }

          }
          else {
            Write-Host "D: drive does not exist. Skipping D:"
          }

          Write-Host ""
          Write-Host "Game data restore finished."


      # =========================================================
      # 9. RESTORE APP LIST
      # =========================================================

      - name: Restore application list
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Continue"

          $rclone = "$env:RCLONE_DIR\rclone.exe"
          $appsFile = "$env:WORK_DIR\apps.json"

          Remove-Item `
            "$appsFile" `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Checking previous apps.json..."

          & $rclone copyto `
            "b2remote:$env:B2_BUCKET/apps/apps.json" `
            "$appsFile" `
            --config "$env:RCLONE_CONFIG" `
            --retries 3 `
            --low-level-retries 5

          if ($LASTEXITCODE -eq 0 -and (Test-Path "$appsFile")) {

            Write-Host "apps.json restored."

          }
          else {

            Write-Host "No previous apps.json."
            Write-Host "Continuing without app restore."

          }

          exit 0


      # =========================================================
      # 10. RESTORE APPLICATIONS USING WINGET
      # =========================================================

      - name: Restore applications
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $appsFile = "$env:WORK_DIR\apps.json"

          if (-not (Test-Path "$appsFile")) {

            Write-Host "No application backup."
            exit 0
          }

          Write-Host "=========================================="
          Write-Host "RESTORING APPLICATIONS"
          Write-Host "=========================================="

          winget import `
            --import-file "$appsFile" `
            --accept-source-agreements `
            --accept-package-agreements `
            --ignore-unavailable

          Write-Host "winget exit code: $LASTEXITCODE"

          # Do not kill the whole RDP workflow if one application
          # cannot be restored.
          exit 0


      # =========================================================
      # 11. INSTALL STAR DESK
      # =========================================================

      - name: Install StarDesk
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=========================================="
          Write-Host "INSTALLING STAR DESK"
          Write-Host "=========================================="

          winget install `
            --id Stardesk.Stardesk `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Write-Host "StarDesk winget exit code: $LASTEXITCODE"

          Start-Sleep -Seconds 10

          Write-Host ""
          Write-Host "StarDesk package status:"

          winget list `
            --id Stardesk.Stardesk `
            --exact

          Write-Host ""
          Write-Host "StarDesk installation checked."


      # =========================================================
      # 12. INSTALL TAILSCALE
      # =========================================================

      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Installing Tailscale..."

          choco install tailscale -y --no-progress

          Start-Sleep -Seconds 10

          Write-Host "Tailscale installation finished."


      # =========================================================
      # 13. CONNECT TAILSCALE
      # =========================================================

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path "$tailscale")) {

            $cmd = Get-Command `
              tailscale.exe `
              -ErrorAction SilentlyContinue

            if ($cmd) {
              $tailscale = $cmd.Source
            }
          }

          if (-not (Test-Path "$tailscale")) {
            throw "tailscale.exe not found"
          }

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp"

          Start-Sleep -Seconds 10

          Write-Host "=========================================="
          Write-Host "TAILSCALE STATUS"
          Write-Host "=========================================="

          & $tailscale status

          Write-Host ""
          Write-Host "TAILSCALE IPv4:"

          & $tailscale ip -4


      # =========================================================
      # 14. CREATE BASELINE
      #
      # Everything existing NOW is considered pre-existing.
      #
      # Therefore:
      # - Windows built-in programs -> ignored
      # - preinstalled software -> ignored
      # - restored games -> ignored
      # - restored files -> ignored
      #
      # Anything downloaded AFTER this point becomes NEW.
      # =========================================================

      - name: Create initial baseline
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=========================================="
          Write-Host "CREATING INITIAL BASELINE"
          Write-Host "=========================================="

          $roots = Get-Content `
            "$env:WORK_DIR\scan-roots.txt"

          $items = New-Object System.Collections.Generic.List[object]

          foreach ($root in $roots) {

            if (-not (Test-Path "$root")) {
              Write-Host "SKIP: $root"
              continue
            }

            Write-Host "Scanning: $root"

            Get-ChildItem `
              -LiteralPath "$root" `
              -Recurse `
              -File `
              -Force `
              -ErrorAction SilentlyContinue |
            ForEach-Object {

              $items.Add(
                [PSCustomObject]@{
                  Path = $_.FullName
                  Length = $_.Length
                  LastWriteTimeUtc = $_.LastWriteTimeUtc.ToString("o")
                }
              )
            }
          }

          $items |
            ConvertTo-Json -Depth 3 |
            Set-Content `
              "$env:MANIFEST" `
              -Encoding UTF8

          Write-Host ""
          Write-Host "BASELINE FILE COUNT: $($items.Count)"
          Write-Host "Baseline created."


      # =========================================================
      # 15. BACKUP APP LIST
      #
      # This is done AFTER restore.
      # StarDesk is included in apps.json automatically if winget
      # recognizes it.
      # =========================================================

      - name: Backup application list
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Continue"

          $rclone = "$env:RCLONE_DIR\rclone.exe"
          $appsFile = "$env:WORK_DIR\apps.json"

          Write-Host "=========================================="
          Write-Host "EXPORTING APPLICATION LIST"
          Write-Host "=========================================="

          winget export `
            --output "$appsFile" `
            --include-versions `
            --accept-source-agreements

          if ($LASTEXITCODE -ne 0) {
            Write-Warning "winget export failed."
            exit 0
          }

          if (-not (Test-Path "$appsFile")) {
            Write-Warning "apps.json was not created."
            exit 0
          }

          & $rclone copyto `
            "$appsFile" `
            "b2remote:$env:B2_BUCKET/apps/apps.json" `
            --config "$env:RCLONE_CONFIG" `
            --retries 5 `
            --low-level-retries 10

          if ($LASTEXITCODE -eq 0) {
            Write-Host "apps.json uploaded."
          }
          else {
            Write-Warning "apps.json upload failed."
          }

          exit 0


      # =========================================================
      # 16. AUTO SCAN + BACKUP
      #
      # Every 5 minutes.
      #
      # NEW FILE:
      #     upload
      #
      # CHANGED FILE:
      #     upload
      #
      # EXISTING FILE:
      #     ignore
      #
      # Deleted file:
      #     NOT deleted from B2
      #     because this is persistence, not mirror/sync.
      # =========================================================

      - name: Auto detect and backup new games
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Continue"

          $rclone = "$env:RCLONE_DIR\rclone.exe"

          $remote = "b2remote:$env:B2_BUCKET/new-games"

          $roots = Get-Content `
            "$env:WORK_DIR\scan-roots.txt"

          # Keep runner alive for about 325 minutes.
          $endTime = (Get-Date).AddMinutes(325)

          $iteration = 0

          while ((Get-Date) -lt $endTime) {

            $iteration++

            Write-Host ""
            Write-Host "=========================================="
            Write-Host "AUTO SCAN #$iteration"
            Write-Host (Get-Date)
            Write-Host "=========================================="

            # -----------------------------------------
            # Load previous baseline
            # -----------------------------------------

            $baseline = @{}

            if (Test-Path "$env:MANIFEST") {

              try {

                $old = Get-Content `
                  "$env:MANIFEST" `
                  -Raw |
                  ConvertFrom-Json

                foreach ($item in $old) {

                  $baseline[$item.Path] =
                    "$($item.Length)|$($item.LastWriteTimeUtc)"
                }

              }
              catch {

                Write-Warning "Could not read baseline."
              }
            }


            # -----------------------------------------
            # Current scan
            # -----------------------------------------

            $current = New-Object System.Collections.Generic.List[object]

            $newFiles = 0
            $changedFiles = 0

            foreach ($root in $roots) {

              if (-not (Test-Path "$root")) {
                continue
              }

              Write-Host ""
              Write-Host "Scanning: $root"

              Get-ChildItem `
                -LiteralPath "$root" `
                -Recurse `
                -File `
                -Force `
                -ErrorAction SilentlyContinue |
              ForEach-Object {

                $fullPath = $_.FullName

                $signature =
                  "$($_.Length)|$($_.LastWriteTimeUtc.ToString('o'))"

                $current.Add(
                  [PSCustomObject]@{
                    Path = $fullPath
                    Length = $_.Length
                    LastWriteTimeUtc =
                      $_.LastWriteTimeUtc.ToString("o")
                  }
                )

                $oldSignature = $baseline[$fullPath]

                # -------------------------------------
                # NEW OR CHANGED
                # -------------------------------------

                if (
                  $null -eq $oldSignature -or
                  $oldSignature -ne $signature
                ) {

                  # Ignore files that are actively being written.
                  # They will be caught during the next scan.
                  $ageSeconds =
                    ((Get-Date) - $_.LastWriteTime).TotalSeconds

                  if ($ageSeconds -lt 60) {

                    Write-Host "WAIT: file still changing:"
                    Write-Host "$fullPath"

                    return
                  }


                  # -----------------------------------
                  # C:
                  # -----------------------------------

                  if (
                    $fullPath.StartsWith(
                      "C:\",
                      [System.StringComparison]::OrdinalIgnoreCase
                    )
                  ) {

                    $relative =
                      $fullPath.Substring(3)

                    $destination =
                      "$remote/C/$relative"
                  }

                  # -----------------------------------
                  # D:
                  # -----------------------------------

                  elseif (
                    $fullPath.StartsWith(
                      "D:\",
                      [System.StringComparison]::OrdinalIgnoreCase
                    )
                  ) {

                    $relative =
                      $fullPath.Substring(3)

                    $destination =
                      "$remote/D/$relative"
                  }

                  else {

                    return
                  }


                  if ($null -eq $oldSignature) {
                    $newFiles++
                    Write-Host ""
                    Write-Host "NEW FILE:"
                  }
                  else {
                    $changedFiles++
                    Write-Host ""
                    Write-Host "CHANGED FILE:"
                  }

                  Write-Host "$fullPath"

                  & $rclone copyto `
                    "$fullPath" `
                    "$destination" `
                    --config "$env:RCLONE_CONFIG" `
                    --retries 3 `
                    --low-level-retries 5 `
                    --transfers 4 `
                    --stats 5s

                  if ($LASTEXITCODE -eq 0) {

                    Write-Host "BACKUP SUCCESS"

                  }
                  else {

                    Write-Warning `
                      "BACKUP FAILED: $fullPath"
                  }
                }
              }
            }


            # -----------------------------------------
            # Save new baseline
            # -----------------------------------------

            $current |
              ConvertTo-Json -Depth 3 |
              Set-Content `
                "$env:MANIFEST" `
                -Encoding UTF8


            Write-Host ""
            Write-Host "------------------------------------------"
            Write-Host "SCAN #$iteration COMPLETE"
            Write-Host "FILES SCANNED : $($current.Count)"
            Write-Host "NEW FILES     : $newFiles"
            Write-Host "CHANGED FILES : $changedFiles"
            Write-Host "------------------------------------------"


            # -----------------------------------------
            # Backup apps.json every scan
            # -----------------------------------------

            Write-Host "Updating application list..."

            $appsFile = "$env:WORK_DIR\apps.json"

            winget export `
              --output "$appsFile" `
              --include-versions `
              --accept-source-agreements

            if (
              $LASTEXITCODE -eq 0 -and
              (Test-Path "$appsFile")
            ) {

              & $rclone copyto `
                "$appsFile" `
                "$remote/../apps/apps.json" `
                --config "$env:RCLONE_CONFIG" `
                --retries 3 `
                --low-level-retries 5

              # If ../apps path isn't accepted by the backend,
              # use the explicit bucket path below.
              if ($LASTEXITCODE -ne 0) {

                & $rclone copyto `
                  "$appsFile" `
                  "b2remote:$env:B2_BUCKET/apps/apps.json" `
                  --config "$env:RCLONE_CONFIG" `
                  --retries 3 `
                  --low-level-retries 5
              }
            }


            # -----------------------------------------
            # Wait 5 minutes
            # -----------------------------------------

            $nextScan =
              (Get-Date).AddMinutes(5)

            while (
              (Get-Date) -lt $nextScan -and
              (Get-Date) -lt $endTime
            ) {

              Start-Sleep -Seconds 10
            }
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "AUTO BACKUP FINISHED"
          Write-Host "=========================================="


      # =========================================================
      # 17. FINAL BACKUP
      # =========================================================

      - name: Final game backup
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Continue"

          $rclone = "$env:RCLONE_DIR\rclone.exe"

          $remote =
            "b2remote:$env:B2_BUCKET/new-games"

          $roots =
            Get-Content "$env:WORK_DIR\scan-roots.txt"

          Write-Host "=========================================="
          Write-Host "FINAL GAME SCAN"
          Write-Host "=========================================="

          $baseline = @{}

          if (Test-Path "$env:MANIFEST") {

            try {

              $old =
                Get-Content `
                  "$env:MANIFEST" `
                  -Raw |
                  ConvertFrom-Json

              foreach ($item in $old) {

                $baseline[$item.Path] =
                  "$($item.Length)|$($item.LastWriteTimeUtc)"
              }

            }
            catch {}
          }


          foreach ($root in $roots) {

            if (-not (Test-Path "$root")) {
              continue
            }

            Write-Host "Final scan: $root"

            Get-ChildItem `
              -LiteralPath "$root" `
              -Recurse `
              -File `
              -Force `
              -ErrorAction SilentlyContinue |
            ForEach-Object {

              $fullPath = $_.FullName

              $signature =
                "$($_.Length)|$($_.LastWriteTimeUtc.ToString('o'))"

              $oldSignature =
                $baseline[$fullPath]


              if (
                $null -eq $oldSignature -or
                $oldSignature -ne $signature
              ) {

                # Skip actively changing files.
                $ageSeconds =
                  ((Get-Date) - $_.LastWriteTime).TotalSeconds

                if ($ageSeconds -lt 60) {
                  return
                }


                if (
                  $fullPath.StartsWith(
                    "C:\",
                    [System.StringComparison]::OrdinalIgnoreCase
                  )
                ) {

                  $relative =
                    $fullPath.Substring(3)

                  $destination =
                    "$remote/C/$relative"
                }

                elseif (
                  $fullPath.StartsWith(
                    "D:\",
                    [System.StringComparison]::OrdinalIgnoreCase
                  )
                ) {

                  $relative =
                    $fullPath.Substring(3)

                  $destination =
                    "$remote/D/$relative"
                }

                else {
                  return
                }


                Write-Host "FINAL BACKUP:"
                Write-Host "$fullPath"

                & $rclone copyto `
                  "$fullPath" `
                  "$destination" `
                  --config "$env:RCLONE_CONFIG" `
                  --retries 5 `
                  --low-level-retries 10 `
                  --transfers 4 `
                  --stats 10s
              }
            }
          }

          Write-Host "Final backup complete."


      # =========================================================
      # 18. FINAL APP LIST
      # =========================================================

      - name: Final application backup
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Continue"

          $rclone =
            "$env:RCLONE_DIR\rclone.exe"

          $appsFile =
            "$env:WORK_DIR\apps.json"

          Write-Host "=========================================="
          Write-Host "FINAL APPLICATION EXPORT"
          Write-Host "=========================================="

          winget export `
            --output "$appsFile" `
            --include-versions `
            --accept-source-agreements

          if (
            $LASTEXITCODE -eq 0 -and
            (Test-Path "$appsFile")
          ) {

            & $rclone copyto `
              "$appsFile" `
              "b2remote:$env:B2_BUCKET/apps/apps.json" `
              --config "$env:RCLONE_CONFIG" `
              --retries 5 `
              --low-level-retries 10

            Write-Host "Final apps.json backup finished."
          }
          else {

            Write-Warning "Final winget export failed."
          }


      # =========================================================
      # 19. VERIFY B2
      # =========================================================

      - name: Verify B2 backup
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Continue"

          $rclone =
            "$env:RCLONE_DIR\rclone.exe"

          Write-Host "=========================================="
          Write-Host "B2 BACKUP VERIFICATION"
          Write-Host "=========================================="


          Write-Host ""
          Write-Host "GAME DATA:"
          & $rclone size `
            "b2remote:$env:B2_BUCKET/new-games" `
            --config "$env:RCLONE_CONFIG"


          Write-Host ""
          Write-Host "APPLICATION DATA:"
          & $rclone size `
            "b2remote:$env:B2_BUCKET/apps" `
            --config "$env:RCLONE_CONFIG"


          Write-Host ""
          Write-Host "B2 CONTENT:"
          & $rclone lsf `
            "b2remote:$env:B2_BUCKET" `
            --config "$env:RCLONE_CONFIG" `
            --max-depth 2


          Write-Host ""
          Write-Host "=========================================="
          Write-Host "WORKFLOW COMPLETE"
          Write-Host "=========================================="
