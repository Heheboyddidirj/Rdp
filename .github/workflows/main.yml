name: Windows RDP + Tailscale + B2 + Auto App Backup

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    env:
      RCLONE_DIR: C:\Rclone
      RCLONE_CONFIG: C:\Rclone\rclone.conf
      WORK_DIR: C:\RDP-PERSIST
      APPS_FILE: C:\RDP-PERSIST\apps.json

    steps:

      # ============================================================
      # 1. PREPARE DIRECTORIES
      # ============================================================
      - name: Prepare directories
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$env:RCLONE_DIR" | Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$env:WORK_DIR" | Out-Null

          Write-Host "Directories prepared."


      # ============================================================
      # 2. INSTALL RCLONE DIRECTLY
      #    NO CHOCOLATEY
      # ============================================================
      - name: Install rclone
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "INSTALLING RCLONE"
          Write-Host "=============================================="

          $rcloneDir = "$env:RCLONE_DIR"
          $zipFile = "$env:TEMP\rclone.zip"
          $extractDir = "$env:TEMP\rclone-extract"

          # Clean previous files
          Remove-Item `
            "$rcloneDir\*" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            "$zipFile" `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            "$extractDir" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$rcloneDir" | Out-Null

          Write-Host "Downloading official rclone Windows AMD64..."

          Invoke-WebRequest `
            -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" `
            -OutFile "$zipFile" `
            -UseBasicParsing

          if (-not (Test-Path "$zipFile")) {
            throw "rclone download failed"
          }

          Write-Host "Download completed."

          Write-Host "Extracting rclone..."

          Expand-Archive `
            -Path "$zipFile" `
            -DestinationPath "$extractDir" `
            -Force

          $rcloneExe = Get-ChildItem `
            -Path "$extractDir" `
            -Filter "rclone.exe" `
            -Recurse `
            -File `
            -ErrorAction Stop |
            Select-Object -First 1

          if (-not $rcloneExe) {
            throw "rclone.exe was not found"
          }

          Write-Host "Real rclone executable:"
          Write-Host $rcloneExe.FullName

          Copy-Item `
            "$($rcloneExe.FullName)" `
            "$rcloneDir\rclone.exe" `
            -Force

          if (-not (Test-Path "$rcloneDir\rclone.exe")) {
            throw "Could not copy rclone.exe"
          }

          Write-Host ""
          Write-Host "RCLONE VERSION:"
          & "$rcloneDir\rclone.exe" version

          if ($LASTEXITCODE -ne 0) {
            throw "rclone test failed"
          }

          Write-Host ""
          Write-Host "rclone installed successfully."

          # Cleanup
          Remove-Item `
            "$zipFile" `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            "$extractDir" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue


      # ============================================================
      # 3. CONFIGURE BACKBLAZE B2
      # ============================================================
      - name: Configure Backblaze B2
        shell: powershell
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
        run: |
          $ErrorActionPreference = "Stop"

          $rclone = "$env:RCLONE_DIR\rclone.exe"

          Write-Host "=============================================="
          Write-Host "CONFIGURING BACKBLAZE B2"
          Write-Host "=============================================="

          Remove-Item `
            "$env:RCLONE_CONFIG" `
            -Force `
            -ErrorAction SilentlyContinue

          & $rclone config create b2remote s3 `
            provider Other `
            access_key_id "$env:B2_KEY_ID" `
            secret_access_key "$env:B2_APPLICATION_KEY" `
            endpoint "$env:B2_ENDPOINT" `
            --config "$env:RCLONE_CONFIG"

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create B2 configuration"
          }

          Write-Host "B2 configuration created."


      # ============================================================
      # 4. TEST B2
      # ============================================================
      - name: Test Backblaze B2
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Stop"

          $rclone = "$env:RCLONE_DIR\rclone.exe"

          Write-Host "=============================================="
          Write-Host "TESTING BACKBLAZE B2"
          Write-Host "=============================================="

          & $rclone lsd `
            "b2remote:$env:B2_BUCKET" `
            --config "$env:RCLONE_CONFIG"

          if ($LASTEXITCODE -ne 0) {
            throw "B2 connection failed"
          }

          Write-Host "B2 connection successful."


      # ============================================================
      # 5. RESTORE PREVIOUS APP LIST
      # ============================================================
      - name: Restore previous app list
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Continue"

          $rclone = "$env:RCLONE_DIR\rclone.exe"

          $appsFile = "$env:APPS_FILE"

          $remote = `
            "b2remote:$env:B2_BUCKET/apps/apps.json"

          Write-Host "=============================================="
          Write-Host "RESTORING PREVIOUS APP LIST"
          Write-Host "=============================================="

          Remove-Item `
            "$appsFile" `
            -Force `
            -ErrorAction SilentlyContinue

          & $rclone copyto `
            "$remote" `
            "$appsFile" `
            --config "$env:RCLONE_CONFIG" `
            --retries 5 `
            --low-level-retries 10

          if (Test-Path "$appsFile") {

            $info = Get-Item "$appsFile"

            Write-Host "Previous app list restored."
            Write-Host "Size: $($info.Length) bytes"

          }
          else {

            Write-Host "No previous app backup found."

          }


      # ============================================================
      # 6. RESTORE / INSTALL APPLICATIONS
      # ============================================================
      - name: Restore installed applications
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $appsFile = "$env:APPS_FILE"

          Write-Host "=============================================="
          Write-Host "RESTORING APPLICATIONS"
          Write-Host "=============================================="

          if (-not (Test-Path "$appsFile")) {

            Write-Host "No apps.json found."
            Write-Host "Skipping application restore."

            exit 0
          }

          Write-Host "Importing applications..."

          winget import `
            --import-file "$appsFile" `
            --accept-source-agreements `
            --accept-package-agreements `
            --ignore-unavailable `
            --disable-interactivity

          $importCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "winget import exit code: $importCode"

          if ($importCode -ne 0) {

            Write-Warning "Some applications may not have been restored."

            Write-Warning "The RDP session will continue."

          }
          else {

            Write-Host "Application restore completed."

          }


      # ============================================================
      # 7. CREATE RDP USER
      # ============================================================
      - name: Create RDP user
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "CREATING RDP USER"
          Write-Host "=============================================="

          $username = "RDP"

          $securePassword = ConvertTo-SecureString `
            "$env:RDP_PASSWORD" `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name "$username" `
            -ErrorAction SilentlyContinue

          if ($existing) {

            Write-Host "RDP user already exists."

            Set-LocalUser `
              -Name "$username" `
              -Password $securePassword

          }
          else {

            New-LocalUser `
              -Name "$username" `
              -Password $securePassword `
              -PasswordNeverExpires `
              -AccountNeverExpires `
              -UserMayNotChangePassword

            Write-Host "RDP user created."

          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "$username" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "$username" `
            -ErrorAction SilentlyContinue

          Write-Host "RDP permissions configured."


      # ============================================================
      # 8. ENABLE REMOTE DESKTOP
      # ============================================================
      - name: Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=============================================="
          Write-Host "ENABLING REMOTE DESKTOP"
          Write-Host "=============================================="

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Write-Host "Remote Desktop enabled."


      # ============================================================
      # 9. INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=============================================="
          Write-Host "INSTALLING TAILSCALE"
          Write-Host "=============================================="

          choco install tailscale -y --no-progress

          Start-Sleep -Seconds 10

          Write-Host "Tailscale installation completed."


      # ============================================================
      # 10. CONNECT TAILSCALE
      # ============================================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "CONNECTING TAILSCALE"
          Write-Host "=============================================="

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path "$tailscale")) {

            $tailscale = `
              "C:\Program Files\Tailscale IPN\tailscale.exe"

          }

          if (-not (Test-Path "$tailscale")) {

            $cmd = Get-Command `
              tailscale.exe `
              -ErrorAction SilentlyContinue

            if ($cmd) {
              $tailscale = $cmd.Source
            }

          }

          if (-not $tailscale) {
            throw "tailscale.exe not found"
          }

          Write-Host "Tailscale executable:"
          Write-Host "$tailscale"

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp"

          Start-Sleep -Seconds 10

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "TAILSCALE STATUS"
          Write-Host "=============================================="

          & $tailscale status

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "TAILSCALE IPv4"
          Write-Host "=============================================="

          & $tailscale ip -4


      # ============================================================
      # 11. KEEP RDP ALIVE + AUTO APP BACKUP
      # ============================================================
      - name: Keep RDP alive + Auto Backup Applications
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Continue"

          $rclone = "$env:RCLONE_DIR\rclone.exe"

          $appsFile = "$env:APPS_FILE"

          $tempFile = `
            "$env:WORK_DIR\apps.new.json"

          $remote = `
            "b2remote:$env:B2_BUCKET/apps/apps.json"

          # ========================================================
          # RDP SESSION TIME
          # ========================================================

          $endTime = `
            (Get-Date).AddMinutes(335)

          $backupNumber = 0

          Write-Host ""
          Write-Host "================================================"
          Write-Host "RDP IS READY"
          Write-Host "================================================"

          Write-Host ""
          Write-Host "Application backup:"
          Write-Host "EVERY 5 MINUTES"

          Write-Host ""
          Write-Host "Backup path:"
          Write-Host "$remote"

          Write-Host ""

          # ========================================================
          # BACKUP LOOP
          # ========================================================

          while ((Get-Date) -lt $endTime) {

            $backupNumber++

            Write-Host ""
            Write-Host "================================================"
            Write-Host "APP BACKUP #$backupNumber"
            Write-Host "TIME: $(Get-Date)"
            Write-Host "================================================"

            # --------------------------------------------------------
            # Delete temporary file
            # --------------------------------------------------------

            Remove-Item `
              "$tempFile" `
              -Force `
              -ErrorAction SilentlyContinue

            # --------------------------------------------------------
            # Export installed applications
            # --------------------------------------------------------

            Write-Host "Exporting installed applications..."

            winget export `
              --output "$tempFile" `
              --include-unknown `
              --accept-source-agreements `
              --disable-interactivity

            $exportCode = $LASTEXITCODE

            # --------------------------------------------------------
            # Check export
            # --------------------------------------------------------

            if (
              $exportCode -eq 0 `
              -and `
              (Test-Path "$tempFile")
            ) {

              Write-Host "winget export successful."

              # ------------------------------------------------------
              # Replace local known-good backup
              # ------------------------------------------------------

              Move-Item `
                "$tempFile" `
                "$appsFile" `
                -Force

              Write-Host "Local apps.json updated."

              # ------------------------------------------------------
              # Upload to B2
              # ------------------------------------------------------

              Write-Host "Uploading apps.json to B2..."

              & $rclone copyto `
                "$appsFile" `
                "$remote" `
                --config "$env:RCLONE_CONFIG" `
                --retries 5 `
                --low-level-retries 10 `
                --stats 10s

              $uploadCode = $LASTEXITCODE

              if ($uploadCode -eq 0) {

                Write-Host ""
                Write-Host "=============================================="
                Write-Host "BACKUP SUCCESSFUL"
                Write-Host "=============================================="

              }
              else {

                Write-Warning `
                  "B2 upload failed."

                Write-Warning `
                  "Local apps.json is preserved."

              }

            }
            else {

              Write-Warning `
                "winget export failed."

              Write-Warning `
                "Exit code: $exportCode"

              Write-Warning `
                "Previous successful backup is preserved."

              Remove-Item `
                "$tempFile" `
                -Force `
                -ErrorAction SilentlyContinue

            }

            # --------------------------------------------------------
            # Display local backup status
            # --------------------------------------------------------

            if (Test-Path "$appsFile") {

              $info = Get-Item "$appsFile"

              Write-Host ""
              Write-Host "Current backup:"
              Write-Host "File: $($info.FullName)"
              Write-Host "Size: $($info.Length) bytes"
              Write-Host "Updated: $($info.LastWriteTime)"

            }

            # --------------------------------------------------------
            # Wait 5 minutes
            # --------------------------------------------------------

            Write-Host ""
            Write-Host "Next backup in 5 minutes..."

            $sleepUntil = `
              (Get-Date).AddMinutes(5)

            while (
              (Get-Date) -lt $sleepUntil `
              -and `
              (Get-Date) -lt $endTime
            ) {

              Start-Sleep -Seconds 10

            }

          }


          # ========================================================
          # FINAL BACKUP
          # ========================================================

          Write-Host ""
          Write-Host "================================================"
          Write-Host "FINAL APPLICATION BACKUP"
          Write-Host "================================================"

          Remove-Item `
            "$tempFile" `
            -Force `
            -ErrorAction SilentlyContinue

          winget export `
            --output "$tempFile" `
            --include-unknown `
            --accept-source-agreements `
            --disable-interactivity

          $finalExportCode = $LASTEXITCODE

          if (
            $finalExportCode -eq 0 `
            -and `
            (Test-Path "$tempFile")
          ) {

            Move-Item `
              "$tempFile" `
              "$appsFile" `
              -Force

            Write-Host "Final export successful."

            & $rclone copyto `
              "$appsFile" `
              "$remote" `
              --config "$env:RCLONE_CONFIG" `
              --retries 5 `
              --low-level-retries 10 `
              --stats 10s

            if ($LASTEXITCODE -eq 0) {

              Write-Host ""
              Write-Host "FINAL BACKUP SUCCESSFUL."

            }
            else {

              Write-Warning `
                "Final B2 upload failed."

            }

          }
          else {

            Write-Warning `
              "Final winget export failed."

            Write-Warning `
              "Previous successful backup remains available."

          }

          Write-Host ""
          Write-Host "RDP session ending."


      # ============================================================
      # 12. VERIFY B2
      # ============================================================
      - name: Verify application backup
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Continue"

          $rclone = "$env:RCLONE_DIR\rclone.exe"

          Write-Host ""
          Write-Host "================================================"
          Write-Host "VERIFYING B2 APPLICATION BACKUP"
          Write-Host "================================================"

          & $rclone ls `
            "b2remote:$env:B2_BUCKET/apps" `
            --config "$env:RCLONE_CONFIG"

          Write-Host ""
          Write-Host "Expected backup:"
          Write-Host "apps/apps.json"

          Write-Host ""
          Write-Host "Workflow completed."
