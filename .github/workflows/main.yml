name: Persistent Windows RDP + Tailscale + B2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    env:
      PROFILE: C:\Users\RDP
      WORK_DIR: C:\RDP-PERSIST
      RCLONE_DIR: C:\Rclone
      RCLONE_CONFIG: C:\Rclone\rclone.conf

    steps:

      # ============================================================
      # 1. PREPARE DIRECTORIES
      # ============================================================
      - name: Prepare directories
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path $env:WORK_DIR | Out-Null
          New-Item -ItemType Directory -Force -Path $env:RCLONE_DIR | Out-Null
          New-Item -ItemType Directory -Force -Path $env:PROFILE | Out-Null

          Write-Host "Directories prepared."

      # ============================================================
      # 2. INSTALL RCLONE
      # ============================================================
      - name: Install rclone
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Get-Command rclone.exe -ErrorAction SilentlyContinue)) {
            choco install rclone -y --no-progress
          }

          $rclone = (Get-Command rclone.exe -ErrorAction Stop).Source

          Copy-Item $rclone "$env:RCLONE_DIR\rclone.exe" -Force

          & "$env:RCLONE_DIR\rclone.exe" version

      # ============================================================
      # 3. CONFIGURE BACKBLAZE B2
      # ============================================================
      - name: Configure Backblaze B2
        shell: powershell
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:B2_KEY_ID)) {
            throw "B2_KEY_ID is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:B2_APPLICATION_KEY)) {
            throw "B2_APPLICATION_KEY is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:B2_BUCKET)) {
            throw "B2_BUCKET is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:B2_ENDPOINT)) {
            throw "B2_ENDPOINT is missing."
          }

          $config = @"
          [b2]
          type = s3
          provider = Other
          access_key_id = $env:B2_KEY_ID
          secret_access_key = $env:B2_APPLICATION_KEY
          endpoint = $env:B2_ENDPOINT
          acl = private
          "@

          Set-Content `
            -Path $env:RCLONE_CONFIG `
            -Value $config `
            -Encoding UTF8

          "B2_REMOTE=b2:$env:B2_BUCKET" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "B2 configuration created."

      # ============================================================
      # 4. TEST B2
      # ============================================================
      - name: Test Backblaze B2
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          & "$env:RCLONE_DIR\rclone.exe" `
            lsd "$env:B2_REMOTE" `
            --config "$env:RCLONE_CONFIG"

          if ($LASTEXITCODE -ne 0) {
            throw "Backblaze B2 connection failed."
          }

          Write-Host "B2 connection OK."

      # ============================================================
      # 5. CREATE RDP USER
      # ============================================================
      - name: Create RDP user
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue

          if ($existing) {
            Set-LocalUser `
              -Name "RDP" `
              -Password $securePassword `
              -PasswordNeverExpires $true `
              -UserMayNotChangePassword $true
          }
          else {
            New-LocalUser `
              -Name "RDP" `
              -Password $securePassword `
              -PasswordNeverExpires `
              -UserMayNotChangePassword `
              -AccountNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user ready."

      # ============================================================
      # 6. INITIALIZE WINDOWS PROFILE PATH
      # ============================================================
      - name: Initialize RDP profile
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $user = Get-LocalUser -Name "RDP"

          $sid = $user.SID.Value

          $profileKey = `
            "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid"

          New-Item -Path $profileKey -Force | Out-Null

          Set-ItemProperty `
            -Path $profileKey `
            -Name "ProfileImagePath" `
            -Value $env:PROFILE

          Set-ItemProperty `
            -Path $profileKey `
            -Name "Flags" `
            -Value 0

          New-Item -ItemType Directory `
            -Force `
            -Path $env:PROFILE | Out-Null

          Write-Host "Profile SID: $sid"
          Write-Host "Profile path: $env:PROFILE"

      # ============================================================
      # 7. ENABLE RDP
      # ============================================================
      - name: Configure Windows RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Restart-Service TermService -Force

          Write-Host "RDP enabled."

      # ============================================================
      # 8. RESTORE PROFILE FROM B2
      # ============================================================
      - name: Restore RDP profile
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $remote = "$env:B2_REMOTE/rdp-profile"

          Write-Host "Checking previous profile backup..."

          & "$env:RCLONE_DIR\rclone.exe" `
            lsf "$remote" `
            --config "$env:RCLONE_CONFIG" `
            --max-depth 1

          if ($LASTEXITCODE -ne 0) {
            Write-Host "No previous profile backup found."
          }
          else {
            Write-Host "Previous profile detected."
            Write-Host "Restoring profile..."

            & "$env:RCLONE_DIR\rclone.exe" copy `
              "$remote" `
              "$env:PROFILE" `
              --config "$env:RCLONE_CONFIG" `
              --transfers 8 `
              --checkers 16 `
              --retries 5 `
              --low-level-retries 10 `
              --create-empty-src-dirs `
              --stats 30s

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Some profile files could not be restored."
            }
            else {
              Write-Host "Profile restore completed."
            }
          }

      # ============================================================
      # 9. RESTORE PROGRAMDATA
      # ============================================================
      - name: Restore ProgramData
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $remote = "$env:B2_REMOTE/programdata"

          Write-Host "Checking ProgramData backup..."

          & "$env:RCLONE_DIR\rclone.exe" lsf `
            "$remote" `
            --config "$env:RCLONE_CONFIG" `
            --max-depth 1

          if ($LASTEXITCODE -eq 0) {

            Write-Host "Restoring ProgramData..."

            & "$env:RCLONE_DIR\rclone.exe" copy `
              "$remote" `
              "C:\ProgramData" `
              --config "$env:RCLONE_CONFIG" `
              --transfers 8 `
              --checkers 16 `
              --retries 3 `
              --low-level-retries 5 `
              --exclude "Microsoft/Windows Defender/**" `
              --exclude "Microsoft/Windows/WindowsUpdate/**" `
              --stats 30s
          }
          else {
            Write-Host "No ProgramData backup found."
          }

      # ============================================================
      # 10. FIX PROFILE PERMISSIONS
      # ============================================================
      - name: Fix RDP profile permissions
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          if (Test-Path $env:PROFILE) {

            Write-Host "Fixing RDP profile permissions..."

            $username = "$env:COMPUTERNAME\RDP"

            icacls $env:PROFILE `
              /grant "${username}:(OI)(CI)F" `
              /T `
              /C

            icacls $env:PROFILE `
              /inheritance:e `
              /T `
              /C

            Write-Host "Permissions updated."
          }

      # ============================================================
      # 11. RESTORE APPLICATION LIST
      # ============================================================
      - name: Restore application list
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $appsFile = "$env:WORK_DIR\apps.json"

          & "$env:RCLONE_DIR\rclone.exe" copyto `
            "$env:B2_REMOTE/system/apps.json" `
            "$appsFile" `
            --config "$env:RCLONE_CONFIG"

          if (Test-Path $appsFile) {

            Write-Host "Application list found."

            Write-Host "Installing previous applications..."

            winget import `
              --import-file "$appsFile" `
              --accept-source-agreements `
              --accept-package-agreements `
              --ignore-unavailable

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Some applications could not be restored."
            }
          }
          else {
            Write-Host "No previous application list found."
          }

      # ============================================================
      # 12. SAVE CURRENT APPLICATION LIST
      # ============================================================
      - name: Export installed applications
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $appsFile = "$env:WORK_DIR\apps.json"

          winget export `
            --output "$appsFile" `
            --include-unknown

          if (Test-Path $appsFile) {

            Write-Host "Uploading application list..."

            & "$env:RCLONE_DIR\rclone.exe" copyto `
              "$appsFile" `
              "$env:B2_REMOTE/system/apps.json" `
              --config "$env:RCLONE_CONFIG"
          }

      # ============================================================
      # 13. INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Get-Command tailscale.exe -ErrorAction SilentlyContinue)) {
            winget install `
              --id Tailscale.Tailscale `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements
          }

          Write-Host "Tailscale installed."

      # ============================================================
      # 14. CONNECT TAILSCALE
      # ============================================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "TAILSCALE_AUTHKEY secret is missing."
          }

          tailscale up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp"

          Start-Sleep -Seconds 10

          tailscale status

          $ip = tailscale ip -4

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "RDP ADDRESS:"
          Write-Host "$ip"
          Write-Host "=========================================="
          Write-Host ""

      # ============================================================
      # 15. CREATE FIRST-LOGIN RESTORE SCRIPT
      # ============================================================
      - name: Create first login restore
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $startup = "$env:PROFILE\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $startup | Out-Null

          $script = "$env:WORK_DIR\first-login.ps1"

          @'
          $ErrorActionPreference = "Continue"

          $marker = "$env:USERPROFILE\.b2-restored"

          if (Test-Path $marker) {
              exit 0
          }

          $rclone = "C:\Rclone\rclone.exe"
          $config = "C:\Rclone\rclone.conf"
          $remote = "B2REMOTE_PLACEHOLDER/rdp-profile"

          Start-Sleep -Seconds 10

          if (Test-Path $rclone) {

              & $rclone copy `
                $remote `
                $env:USERPROFILE `
                --config $config `
                --transfers 8 `
                --checkers 16 `
                --retries 5 `
                --low-level-retries 10 `
                --exclude "AppData/Local/Temp/**" `
                --exclude "AppData/Local/Microsoft/Edge/User Data/Default/Cache/**" `
                --exclude "AppData/Local/Google/Chrome/User Data/Default/Cache/**" `
                --stats 30s

              New-Item `
                -ItemType File `
                -Force `
                -Path $marker | Out-Null
          }
          '@.Replace(
            "B2REMOTE_PLACEHOLDER",
            $env:B2_REMOTE
          ) |
            Set-Content `
              -Path $script `
              -Encoding UTF8

          $cmd = "$startup\Restore-B2.cmd"

          "@echo off`r`npowershell.exe -NoProfile -ExecutionPolicy Bypass -File `"$script`"" |
            Set-Content `
              -Path $cmd `
              -Encoding ASCII

          Write-Host "First-login restore created."

      # ============================================================
      # 16. DEBUG PROFILE
      # ============================================================
      - name: Check RDP profile
        shell: powershell
        run: |
          Write-Host "========== RDP PROFILE =========="

          Write-Host "Path:"
          Write-Host $env:PROFILE

          Write-Host ""
          Write-Host "NTUSER:"
          Write-Host (Test-Path "$env:PROFILE\NTUSER.DAT")

          Write-Host ""
          Write-Host "Profile size:"

          $size = (
            Get-ChildItem `
              $env:PROFILE `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue |
            Where-Object {!$_.PSIsContainer} |
            Measure-Object Length -Sum
          ).Sum

          "{0:N2} MB" -f ($size / 1MB)

      # ============================================================
      # 17. KEEP RDP ALIVE + BACKUP EVERY 5 MINUTES
      # ============================================================
      - name: Keep RDP alive and backup every 5 minutes
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $rclone = "$env:RCLONE_DIR\rclone.exe"

          $profileRemote = "$env:B2_REMOTE/rdp-profile"
          $programDataRemote = "$env:B2_REMOTE/programdata"

          $endTime = (Get-Date).AddMinutes(335)

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "RDP IS READY"
          Write-Host "=========================================="

          $ip = tailscale ip -4

          Write-Host "Address: $ip"
          Write-Host "Username: RDP"
          Write-Host "Backup interval: 5 minutes"
          Write-Host "=========================================="
          Write-Host ""

          while ((Get-Date) -lt $endTime) {

            Write-Host ""
            Write-Host "[$(Get-Date)] Starting backup..."

            if (Test-Path "$env:PROFILE\NTUSER.DAT") {

              & $rclone copy `
                "$env:PROFILE" `
                "$profileRemote" `
                --config "$env:RCLONE_CONFIG" `
                --transfers 8 `
                --checkers 16 `
                --retries 3 `
                --low-level-retries 5 `
                --exclude "AppData/Local/Temp/**" `
                --exclude "AppData/Local/Microsoft/Edge/User Data/Default/Cache/**" `
                --exclude "AppData/Local/Google/Chrome/User Data/Default/Cache/**" `
                --stats 30s

              if ($LASTEXITCODE -eq 0) {
                Write-Host "Profile backup OK."
              }
              else {
                Write-Warning "Some profile files could not be backed up."
              }

              & $rclone copy `
                "C:\ProgramData" `
                "$programDataRemote" `
                --config "$env:RCLONE_CONFIG" `
                --transfers 8 `
                --checkers 16 `
                --retries 2 `
                --low-level-retries 3 `
                --exclude "Microsoft/Windows Defender/**" `
                --exclude "Microsoft/Windows/WindowsUpdate/**" `
                --stats 30s

            }
            else {
              Write-Host "RDP profile has not been initialized yet."
              Write-Host "Waiting for the first RDP login..."
            }

            Write-Host ""
            Write-Host "Next backup in 5 minutes."

            Start-Sleep -Seconds 300
          }

      # ============================================================
      # 18. FINAL BACKUP
      # ============================================================
      - name: Final backup
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $rclone = "$env:RCLONE_DIR\rclone.exe"

          Write-Host "=========================================="
          Write-Host "FINAL BACKUP"
          Write-Host "=========================================="

          if (Test-Path $env:PROFILE) {

            & $rclone copy `
              "$env:PROFILE" `
              "$env:B2_REMOTE/rdp-profile" `
              --config "$env:RCLONE_CONFIG" `
              --transfers 8 `
              --checkers 16 `
              --retries 5 `
              --low-level-retries 10 `
              --exclude "AppData/Local/Temp/**" `
              --exclude "AppData/Local/Microsoft/Edge/User Data/Default/Cache/**" `
              --exclude "AppData/Local/Google/Chrome/User Data/Default/Cache/**" `
              --stats 30s
          }

          if (Test-Path "C:\ProgramData") {

            & $rclone copy `
              "C:\ProgramData" `
              "$env:B2_REMOTE/programdata" `
              --config "$env:RCLONE_CONFIG" `
              --transfers 8 `
              --checkers 16 `
              --retries 3 `
              --low-level-retries 5 `
              --exclude "Microsoft/Windows Defender/**" `
              --exclude "Microsoft/Windows/WindowsUpdate/**" `
              --stats 30s
          }

          Write-Host "Final backup finished."

      # ============================================================
      # 19. VERIFY BACKUP
      # ============================================================
      - name: Verify backup
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "========== B2 BACKUP =========="

          & "$env:RCLONE_DIR\rclone.exe" size `
            "$env:B2_REMOTE/rdp-profile" `
            --config "$env:RCLONE_CONFIG"

          Write-Host ""
          Write-Host "========== APPLICATION BACKUP =========="

          & "$env:RCLONE_DIR\rclone.exe" size `
            "$env:B2_REMOTE/system" `
            --config "$env:RCLONE_CONFIG"

          Write-Host ""
          Write-Host "========== PROGRAMDATA BACKUP =========="

          & "$env:RCLONE_DIR\rclone.exe" size `
            "$env:B2_REMOTE/programdata" `
            --config "$env:RCLONE_CONFIG"
