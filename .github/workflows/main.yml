name: Windows RDP + Tailscale + B2 + Auto Game Backup V4

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 500

    env:
      RCLONE_DIR: C:\Rclone
      RCLONE_CONFIG: C:\Rclone\rclone.conf
      WORK_DIR: C:\RDP-PERSIST
      RDP_USER: RDP
      RDP_HOME: C:\Users\RDP
      MANIFEST: C:\RDP-PERSIST\baseline.json

    steps:

      # ============================================================
      # 1. PREPARE
      # ============================================================
      - name: Prepare
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force `
            -Path "$env:RCLONE_DIR" | Out-Null

          New-Item -ItemType Directory -Force `
            -Path "$env:WORK_DIR" | Out-Null

          Write-Host "RDP USER: $env:RDP_USER"
          Write-Host "RDP HOME: $env:RDP_HOME"

      # ============================================================
      # 2. INSTALL RCLONE
      # ============================================================
      - name: Install rclone
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $zip = "$env:TEMP\rclone.zip"
          $extract = "$env:TEMP\rclone-extract"

          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue

          Invoke-WebRequest `
            -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" `
            -OutFile $zip `
            -UseBasicParsing

          Expand-Archive `
            -Path $zip `
            -DestinationPath $extract `
            -Force

          $exe = Get-ChildItem `
            -Path $extract `
            -Filter "rclone.exe" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $exe) {
            throw "rclone.exe not found"
          }

          Copy-Item `
            $exe.FullName `
            "$env:RCLONE_DIR\rclone.exe" `
            -Force

          & "$env:RCLONE_DIR\rclone.exe" version

          if ($LASTEXITCODE -ne 0) {
            throw "rclone failed"
          }

      # ============================================================
      # 3. CONFIGURE B2
      # ============================================================
      - name: Configure B2
        shell: powershell
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
        run: |
          $ErrorActionPreference = "Stop"

          $rclone = "$env:RCLONE_DIR\rclone.exe"

          Remove-Item `
            "$env:RCLONE_CONFIG" `
            -Force `
            -ErrorAction SilentlyContinue

          & $rclone config create b2remote s3 `
            provider Other `
            access_key_id "$env:B2_KEY_ID" `
            secret_access_key "$env:B2_APPLICATION_KEY" `
            endpoint "$env:B2_ENDPOINT" `
            --config "$env:RCLONE_CONFIG"

          if ($LASTEXITCODE -ne 0) {
            throw "B2 configuration failed"
          }

      # ============================================================
      # 4. TEST B2
      # ============================================================
      - name: Test B2
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Stop"

          & "$env:RCLONE_DIR\rclone.exe" lsd `
            "b2remote:$env:B2_BUCKET" `
            --config "$env:RCLONE_CONFIG"

          if ($LASTEXITCODE -ne 0) {
            throw "B2 unavailable"
          }

      # ============================================================
      # 5. CREATE RDP USER
      # ============================================================
      - name: Create RDP user
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $password = ConvertTo-SecureString `
            "$env:RDP_PASSWORD" `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name "$env:RDP_USER" `
            -ErrorAction SilentlyContinue

          if ($user) {

            Set-LocalUser `
              -Name "$env:RDP_USER" `
              -Password $password

          } else {

            New-LocalUser `
              -Name "$env:RDP_USER" `
              -Password $password `
              -PasswordNeverExpires `
              -AccountNeverExpires `
              -UserMayNotChangePassword
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "$env:RDP_USER" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "$env:RDP_USER" `
            -ErrorAction SilentlyContinue

      # ============================================================
      # 6. ENABLE RDP
      # ============================================================
      - name: Enable RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

      # ============================================================
      # 7. CREATE INITIAL BASELINE
      #
      # Everything existing here is considered:
      # "ALREADY AVAILABLE"
      #
      # Therefore it will NOT be backed up.
      # ============================================================
      - name: Create initial game baseline
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=========================================="
          Write-Host "CREATING INITIAL BASELINE"
          Write-Host "=========================================="

          $roots = @(
            "C:\Games",
            "D:\Games",
            "C:\XboxGames",
            "$env:RDP_HOME"
          )

          $items = @()

          foreach ($root in $roots) {

            if (-not (Test-Path $root)) {
              Write-Host "SKIP: $root"
              continue
            }

            Write-Host "Scanning: $root"

            try {

              Get-ChildItem `
                -LiteralPath $root `
                -Recurse `
                -File `
                -Force `
                -ErrorAction SilentlyContinue |
              ForEach-Object {

                $items += [PSCustomObject]@{
                  Path = $_.FullName
                  Length = $_.Length
                  LastWriteTimeUtc = $_.LastWriteTimeUtc.ToString("o")
                }
              }

            } catch {

              Write-Warning "Could not scan $root"
            }
          }

          $items |
            ConvertTo-Json -Depth 3 |
            Set-Content `
              -Path "$env:MANIFEST" `
              -Encoding UTF8

          Write-Host ""
          Write-Host "BASELINE FILES: $($items.Count)"
          Write-Host "Baseline saved to $env:MANIFEST"

      # ============================================================
      # 8. RESTORE PREVIOUSLY BACKED-UP NEW GAME DATA
      # ============================================================
      - name: Restore previous game backup
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Continue"

          $rclone = "$env:RCLONE_DIR\rclone.exe"

          Write-Host "=========================================="
          Write-Host "RESTORING PREVIOUS GAME BACKUP"
          Write-Host "=========================================="

          & $rclone copy `
            "b2remote:$env:B2_BUCKET/new-games" `
            "C:\" `
            --config "$env:RCLONE_CONFIG" `
            --retries 5 `
            --low-level-retries 10 `
            --transfers 4 `
            --checkers 8 `
            --stats 30s

          Write-Host "Previous game data restore finished."

      # ============================================================
      # 9. CREATE POST-RESTORE BASELINE
      #
      # Restored files are now also considered known.
      # This prevents them from being uploaded again immediately.
      # ============================================================
      - name: Update baseline after restore
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $roots = @(
            "C:\Games",
            "D:\Games",
            "C:\XboxGames",
            "$env:RDP_HOME"
          )

          $items = @()

          foreach ($root in $roots) {

            if (-not (Test-Path $root)) {
              continue
            }

            Get-ChildItem `
              -LiteralPath $root `
              -Recurse `
              -File `
              -Force `
              -ErrorAction SilentlyContinue |
            ForEach-Object {

              $items += [PSCustomObject]@{
                Path = $_.FullName
                Length = $_.Length
                LastWriteTimeUtc = $_.LastWriteTimeUtc.ToString("o")
              }
            }
          }

          $items |
            ConvertTo-Json -Depth 3 |
            Set-Content `
              -Path "$env:MANIFEST" `
              -Encoding UTF8

          Write-Host "POST-RESTORE BASELINE: $($items.Count) files"

      # ============================================================
      # 10. TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          choco install tailscale -y --no-progress
          Start-Sleep -Seconds 10

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            $cmd = Get-Command tailscale.exe `
              -ErrorAction SilentlyContinue

            if ($cmd) {
              $tailscale = $cmd.Source
            }
          }

          if (-not (Test-Path $tailscale)) {
            throw "Tailscale not found"
          }

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp"

          Start-Sleep -Seconds 10

          & $tailscale status
          & $tailscale ip -4

      # ============================================================
      # 11. AUTO SCAN + BACKUP
      #
      # Every 5 minutes:
      #
      # New file          -> backup
      # Modified file     -> backup
      # Existing unchanged -> ignore
      # ============================================================
      - name: Auto detect and backup new game data
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Continue"

          $rclone = "$env:RCLONE_DIR\rclone.exe"

          $remote = `
            "b2remote:$env:B2_BUCKET/new-games"

          $endTime = (Get-Date).AddMinutes(325)

          $roots = @(
            "C:\Games",
            "D:\Games",
            "C:\XboxGames",
            "$env:RDP_HOME"
          )

          $iteration = 0

          while ((Get-Date) -lt $endTime) {

            $iteration++

            Write-Host ""
            Write-Host "=========================================="
            Write-Host "GAME SCAN #$iteration"
            Write-Host (Get-Date)
            Write-Host "=========================================="

            # ------------------------------------------------------
            # Load previous baseline
            # ------------------------------------------------------

            $baseline = @{}

            if (Test-Path "$env:MANIFEST") {

              try {

                $old = Get-Content `
                  "$env:MANIFEST" `
                  -Raw |
                  ConvertFrom-Json

                foreach ($item in $old) {

                  $baseline[$item.Path] = `
                    "$($item.Length)|$($item.LastWriteTimeUtc)"
                }

              } catch {

                Write-Warning "Could not load baseline."
              }
            }

            $current = @()

            foreach ($root in $roots) {

              if (-not (Test-Path $root)) {
                continue
              }

              Write-Host "Scanning: $root"

              Get-ChildItem `
                -LiteralPath $root `
                -Recurse `
                -File `
                -Force `
                -ErrorAction SilentlyContinue |
              ForEach-Object {

                $signature = `
                  "$($_.Length)|$($_.LastWriteTimeUtc.ToString('o'))"

                $current += [PSCustomObject]@{
                  Path = $_.FullName
                  Length = $_.Length
                  LastWriteTimeUtc = $_.LastWriteTimeUtc.ToString("o")
                }

                $oldSignature = $baseline[$_.FullName]

                # --------------------------------------------------
                # NEW OR CHANGED FILE
                # --------------------------------------------------

                if ($null -eq $oldSignature -or `
                    $oldSignature -ne $signature) {

                  $fullPath = $_.FullName

                  # -----------------------------------------------
                  # Convert absolute path to backup-relative path
                  # -----------------------------------------------

                  if ($fullPath.StartsWith("C:\", `
                    [System.StringComparison]::OrdinalIgnoreCase)) {

                    $relative = `
                      $fullPath.Substring(3)

                    $destination = `
                      "$remote/C/$relative"

                  } elseif ($fullPath.StartsWith("D:\", `
                    [System.StringComparison]::OrdinalIgnoreCase)) {

                    $relative = `
                      $fullPath.Substring(3)

                    $destination = `
                      "$remote/D/$relative"

                  } else {

                    continue
                  }

                  Write-Host ""
                  Write-Host "NEW/CHANGED:"
                  Write-Host "$fullPath"

                  # -----------------------------------------------
                  # Upload only this file
                  # -----------------------------------------------

                  $parent = Split-Path `
                    $destination `
                    -Parent

                  & $rclone copyto `
                    "$fullPath" `
                    "$destination" `
                    --config "$env:RCLONE_CONFIG" `
                    --retries 3 `
                    --low-level-retries 5 `
                    --stats 5s

                  if ($LASTEXITCODE -eq 0) {

                    Write-Host "BACKUP OK"

                  } else {

                    Write-Warning `
                      "BACKUP FAILED: $fullPath"
                  }
                }
              }
            }

            # ------------------------------------------------------
            # Save current baseline
            # ------------------------------------------------------

            $current |
              ConvertTo-Json -Depth 3 |
              Set-Content `
                "$env:MANIFEST" `
                -Encoding UTF8

            Write-Host ""
            Write-Host "FILES SCANNED: $($current.Count)"

            # ------------------------------------------------------
            # Wait 5 minutes
            # ------------------------------------------------------

            $next = (Get-Date).AddMinutes(5)

            while (
              (Get-Date) -lt $next -and
              (Get-Date) -lt $endTime
            ) {

              Start-Sleep -Seconds 10
            }
          }

          Write-Host ""
          Write-Host "AUTO BACKUP LOOP FINISHED."

      # ============================================================
      # 12. FINAL SCAN
      # ============================================================
      - name: Final game scan
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Continue"

          $rclone = "$env:RCLONE_DIR\rclone.exe"

          $remote = `
            "b2remote:$env:B2_BUCKET/new-games"

          $roots = @(
            "C:\Games",
            "D:\Games",
            "C:\XboxGames",
            "$env:RDP_HOME"
          )

          Write-Host "=========================================="
          Write-Host "FINAL GAME SCAN"
          Write-Host "=========================================="

          $baseline = @{}

          if (Test-Path "$env:MANIFEST") {

            $old = Get-Content `
              "$env:MANIFEST" `
              -Raw |
              ConvertFrom-Json

            foreach ($item in $old) {

              $baseline[$item.Path] = `
                "$($item.Length)|$($item.LastWriteTimeUtc)"
            }
          }

          $current = @()

          foreach ($root in $roots) {

            if (-not (Test-Path $root)) {
              continue
            }

            Get-ChildItem `
              -LiteralPath $root `
              -Recurse `
              -File `
              -Force `
              -ErrorAction SilentlyContinue |
            ForEach-Object {

              $signature = `
                "$($_.Length)|$($_.LastWriteTimeUtc.ToString('o'))"

              $current += [PSCustomObject]@{
                Path = $_.FullName
                Length = $_.Length
                LastWriteTimeUtc = $_.LastWriteTimeUtc.ToString("o")
              }

              if (
                $null -eq $baseline[$_.FullName] -or
                $baseline[$_.FullName] -ne $signature
              ) {

                if (
                  $_.FullName.StartsWith(
                    "C:\",
                    [System.StringComparison]::OrdinalIgnoreCase
                  )
                ) {

                  $relative = $_.FullName.Substring(3)

                  $destination = `
                    "$remote/C/$relative"

                } elseif (
                  $_.FullName.StartsWith(
                    "D:\",
                    [System.StringComparison]::OrdinalIgnoreCase
                  )
                ) {

                  $relative = $_.FullName.Substring(3)

                  $destination = `
                    "$remote/D/$relative"

                } else {

                  return
                }

                Write-Host "FINAL BACKUP: $($_.FullName)"

                & $rclone copyto `
                  "$($_.FullName)" `
                  "$destination" `
                  --config "$env:RCLONE_CONFIG" `
                  --retries 5 `
                  --low-level-retries 10 `
                  --stats 10s
              }
            }
          }

          Write-Host "FINAL SCAN COMPLETE."

      # ============================================================
      # 13. SHOW B2 SIZE
      # ============================================================
      - name: Verify game backup
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Continue"

          $rclone = "$env:RCLONE_DIR\rclone.exe"

          Write-Host "=========================================="
          Write-Host "BACKED UP GAME DATA"
          Write-Host "=========================================="

          & $rclone size `
            "b2remote:$env:B2_BUCKET/new-games" `
            --config "$env:RCLONE_CONFIG"

          Write-Host ""
          Write-Host "WORKFLOW COMPLETE."
