name: Windows RDP + Tailscale + B2 + Auto App Backup

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    env:
      RCLONE_DIR: C:\Rclone
      RCLONE_CONFIG: C:\Rclone\rclone.conf
      WORK_DIR: C:\RDP-PERSIST
      APPS_FILE: C:\RDP-PERSIST\apps.json

    steps:

      # ============================================================
      # 1. CREATE WORK DIRECTORIES
      # ============================================================
      - name: Prepare directories
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path "$env:RCLONE_DIR" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:WORK_DIR" | Out-Null

          Write-Host "Directories ready."


      # ============================================================
      # 2. INSTALL RCLONE
      # ============================================================
      - name: Install rclone
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Installing rclone..."

          # Remove broken Chocolatey rclone installations/shims
          choco uninstall rclone.portable -y --force --no-progress 2>$null
          choco uninstall rclone -y --force --no-progress 2>$null

          # Clean old files
          Remove-Item "C:\Rclone\*" -Recurse -Force -ErrorAction SilentlyContinue

          # Install rclone
          choco install rclone -y --no-progress

          Start-Sleep -Seconds 5

          # Find actual rclone.exe
          $possible = @(
            "C:\ProgramData\chocolatey\bin\rclone.exe",
            "C:\ProgramData\chocolatey\lib\rclone\tools\rclone.exe",
            "C:\ProgramData\chocolatey\lib\rclone.portable\tools\rclone.exe"
          )

          $found = $null

          foreach ($p in $possible) {
            if (Test-Path $p) {
              $found = $p
              break
            }
          }

          if (-not $found) {
            $found = (Get-ChildItem `
              "C:\ProgramData\chocolatey\lib" `
              -Filter "rclone.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName)
          }

          if (-not $found) {
            throw "Could not find rclone.exe"
          }

          Write-Host "Found rclone at:"
          Write-Host $found

          Copy-Item $found "$env:RCLONE_DIR\rclone.exe" -Force

          & "$env:RCLONE_DIR\rclone.exe" version

          if ($LASTEXITCODE -ne 0) {
            throw "rclone test failed"
          }

          Write-Host "rclone installed successfully."


      # ============================================================
      # 3. CONFIGURE BACKBLAZE B2
      # ============================================================
      - name: Configure Backblaze B2
        shell: powershell
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
        run: |
          $ErrorActionPreference = "Stop"

          $rclone = "$env:RCLONE_DIR\rclone.exe"

          Write-Host "Configuring Backblaze B2..."

          & $rclone config create b2remote s3 `
            provider Other `
            access_key_id "$env:B2_KEY_ID" `
            secret_access_key "$env:B2_APPLICATION_KEY" `
            endpoint "$env:B2_ENDPOINT" `
            --config "$env:RCLONE_CONFIG"

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create rclone B2 configuration"
          }

          Write-Host "B2 configuration created."


      # ============================================================
      # 4. TEST B2
      # ============================================================
      - name: Test Backblaze B2
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Stop"

          $rclone = "$env:RCLONE_DIR\rclone.exe"

          Write-Host "Testing B2..."

          & $rclone lsd `
            "b2remote:$env:B2_BUCKET" `
            --config "$env:RCLONE_CONFIG"

          if ($LASTEXITCODE -ne 0) {
            throw "B2 connection failed"
          }

          Write-Host "B2 connection OK."


      # ============================================================
      # 5. RESTORE PREVIOUS APP LIST
      # ============================================================
      - name: Restore previous app list
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Continue"

          $rclone = "$env:RCLONE_DIR\rclone.exe"
          $appsFile = "$env:APPS_FILE"

          $remote = "b2remote:$env:B2_BUCKET/apps/apps.json"

          Write-Host "Checking for previous app backup..."

          & $rclone copyto `
            "$remote" `
            "$appsFile" `
            --config "$env:RCLONE_CONFIG" `
            --retries 5 `
            --low-level-retries 10

          if (Test-Path $appsFile) {
            Write-Host "Previous app list restored:"
            Get-Item $appsFile | Format-List Name,Length,LastWriteTime
          }
          else {
            Write-Host "No previous app backup found."
          }


      # ============================================================
      # 6. RESTORE / INSTALL APPS
      # ============================================================
      - name: Restore installed applications
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $appsFile = "$env:APPS_FILE"

          if (-not (Test-Path $appsFile)) {
            Write-Host "No apps.json available. Skipping app restore."
            exit 0
          }

          Write-Host "Starting application restore..."

          winget import `
            --import-file "$appsFile" `
            --accept-source-agreements `
            --accept-package-agreements `
            --ignore-unavailable `
            --disable-interactivity

          $code = $LASTEXITCODE

          Write-Host "winget import exit code: $code"

          if ($code -ne 0) {
            Write-Warning "Some applications may not have been restored."
            Write-Warning "This does not stop the RDP session."
          }

          Write-Host "Application restore finished."


      # ============================================================
      # 7. CREATE RDP USER
      # ============================================================
      - name: Create RDP user
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $username = "RDP"

          $securePassword = ConvertTo-SecureString `
            "$env:RDP_PASSWORD" `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($existing) {
            Write-Host "RDP user already exists."

            Set-LocalUser `
              -Name $username `
              -Password $securePassword
          }
          else {
            New-LocalUser `
              -Name $username `
              -Password $securePassword `
              -PasswordNeverExpires `
              -AccountNeverExpires `
              -UserMayNotChangePassword

            Write-Host "RDP user created."
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "RDP permissions configured."


      # ============================================================
      # 8. ENABLE WINDOWS RDP
      # ============================================================
      - name: Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Write-Host "RDP enabled."


      # ============================================================
      # 9. INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Installing Tailscale..."

          choco install tailscale -y --no-progress

          Start-Sleep -Seconds 10

          Write-Host "Tailscale installation finished."


      # ============================================================
      # 10. CONNECT TAILSCALE
      # ============================================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Connecting Tailscale..."

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            $tailscale = "C:\Program Files\Tailscale IPN\tailscale.exe"
          }

          if (-not (Test-Path $tailscale)) {
            $tailscale = (Get-Command tailscale.exe -ErrorAction SilentlyContinue).Source
          }

          if (-not $tailscale) {
            throw "tailscale.exe not found"
          }

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp"

          Start-Sleep -Seconds 10

          Write-Host ""
          Write-Host "=============================="
          Write-Host "TAILSCALE STATUS"
          Write-Host "=============================="

          & $tailscale status

          Write-Host ""
          Write-Host "=============================="
          Write-Host "TAILSCALE IP"
          Write-Host "=============================="

          & $tailscale ip -4


      # ============================================================
      # 11. AUTO BACKUP APPS EVERY 5 MINUTES
      # ============================================================
      - name: Keep RDP alive + Auto Backup Applications
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Continue"

          $rclone = "$env:RCLONE_DIR\rclone.exe"
          $appsFile = "$env:APPS_FILE"
          $tempFile = "$env:WORK_DIR\apps.new.json"

          $remote = "b2remote:$env:B2_BUCKET/apps/apps.json"

          # Keep the machine alive for about 5 hours 35 minutes.
          $endTime = (Get-Date).AddMinutes(335)

          $backupNumber = 0

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "RDP IS READY"
          Write-Host "AUTO APP BACKUP: EVERY 5 MINUTES"
          Write-Host "=============================================="
          Write-Host ""

          while ((Get-Date) -lt $endTime) {

            $backupNumber++

            Write-Host ""
            Write-Host "=============================================="
            Write-Host "APP BACKUP #$backupNumber"
            Write-Host "Time: $(Get-Date)"
            Write-Host "=============================================="

            # Remove temporary export
            Remove-Item `
              "$tempFile" `
              -Force `
              -ErrorAction SilentlyContinue

            # Export installed applications
            Write-Host "Exporting installed applications..."

            winget export `
              --output "$tempFile" `
              --include-unknown `
              --accept-source-agreements `
              --disable-interactivity

            $exportCode = $LASTEXITCODE

            if ($exportCode -eq 0 -and (Test-Path $tempFile)) {

              # Replace the known-good local backup
              Move-Item `
                "$tempFile" `
                "$appsFile" `
                -Force

              Write-Host "winget export successful."

              # Upload app list to B2
              Write-Host "Uploading apps.json to Backblaze B2..."

              & $rclone copyto `
                "$appsFile" `
                "$remote" `
                --config "$env:RCLONE_CONFIG" `
                --retries 5 `
                --low-level-retries 10 `
                --stats 10s

              $uploadCode = $LASTEXITCODE

              if ($uploadCode -eq 0) {
                Write-Host "BACKUP SUCCESSFUL."
              }
              else {
                Write-Warning "B2 upload failed. Local apps.json is still preserved."
              }

            }
            else {

              Write-Warning "winget export failed."
              Write-Warning "Exit code: $exportCode"
              Write-Warning "Previous backup will be kept."

              Remove-Item `
                "$tempFile" `
                -Force `
                -ErrorAction SilentlyContinue
            }

            # Show current backup
            if (Test-Path $appsFile) {
              $fileInfo = Get-Item "$appsFile"

              Write-Host ""
              Write-Host "Current local backup:"
              Write-Host "File: $($fileInfo.FullName)"
              Write-Host "Size: $($fileInfo.Length) bytes"
              Write-Host "Updated: $($fileInfo.LastWriteTime)"
            }

            Write-Host ""
            Write-Host "Next automatic backup in 5 minutes..."

            # Sleep in small intervals so shutdown is clean
            $sleepUntil = (Get-Date).AddMinutes(5)

            while ((Get-Date) -lt $sleepUntil -and (Get-Date) -lt $endTime) {
              Start-Sleep -Seconds 10
            }
          }

          # ========================================================
          # FINAL BACKUP
          # ========================================================

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "FINAL APPLICATION BACKUP"
          Write-Host "=============================================="

          Remove-Item `
            "$tempFile" `
            -Force `
            -ErrorAction SilentlyContinue

          winget export `
            --output "$tempFile" `
            --include-unknown `
            --accept-source-agreements `
            --disable-interactivity

          $finalExportCode = $LASTEXITCODE

          if ($finalExportCode -eq 0 -and (Test-Path $tempFile)) {

            Move-Item `
              "$tempFile" `
              "$appsFile" `
              -Force

            Write-Host "Final export successful."

            & $rclone copyto `
              "$appsFile" `
              "$remote" `
              --config "$env:RCLONE_CONFIG" `
              --retries 5 `
              --low-level-retries 10 `
              --stats 10s

            if ($LASTEXITCODE -eq 0) {
              Write-Host "FINAL BACKUP SUCCESSFUL."
            }
            else {
              Write-Warning "Final B2 upload failed."
            }

          }
          else {
            Write-Warning "Final winget export failed."
            Write-Warning "Keeping previous successful backup."
          }

          Write-Host ""
          Write-Host "RDP session ending."


      # ============================================================
      # 12. VERIFY B2 BACKUP
      # ============================================================
      - name: Verify application backup
        shell: powershell
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          $ErrorActionPreference = "Continue"

          $rclone = "$env:RCLONE_DIR\rclone.exe"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "VERIFYING B2 BACKUP"
          Write-Host "=============================================="

          & $rclone ls `
            "b2remote:$env:B2_BUCKET/apps" `
            --config "$env:RCLONE_CONFIG"

          Write-Host ""
          Write-Host "Backup location:"
          Write-Host "apps/apps.json"

          Write-Host ""
          Write-Host "Workflow finished."
