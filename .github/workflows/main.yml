name: Windows RDP + Tailscale + Backblaze B2 Backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    runs-on: windows-2022

    # GitHub-hosted runner là máy tạm thời.
    # 350 phút gần mức tối đa cho job này.
    timeout-minutes: 350

    env:
      PROFILE: C:\Users\RDP
      RCLONE_DIR: C:\rclone
      RCLONE_CONFIG: C:\rclone\rclone.conf

    steps:

      # ============================================================
      # 1. Cài rclone
      # ============================================================
      - name: Install rclone
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Path $env:RCLONE_DIR -Force | Out-Null

          $zip = "$env:TEMP\rclone.zip"

          Invoke-WebRequest `
            -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" `
            -OutFile $zip

          Expand-Archive `
            -Path $zip `
            -DestinationPath "$env:TEMP\rclone_extract" `
            -Force

          $exe = Get-ChildItem `
            "$env:TEMP\rclone_extract" `
            -Filter "rclone.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "rclone.exe not found"
          }

          Copy-Item `
            $exe.FullName `
            "$env:RCLONE_DIR\rclone.exe" `
            -Force

          & "$env:RCLONE_DIR\rclone.exe" version


      # ============================================================
      # 2. Cấu hình Backblaze B2
      # ============================================================
      - name: Configure Backblaze B2
        shell: powershell
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:B2_KEY_ID) {
            throw "B2_KEY_ID is missing"
          }

          if (-not $env:B2_APPLICATION_KEY) {
            throw "B2_APPLICATION_KEY is missing"
          }

          if (-not $env:B2_BUCKET) {
            throw "B2_BUCKET is missing"
          }

          if (-not $env:B2_ENDPOINT) {
            throw "B2_ENDPOINT is missing"
          }

          New-Item `
            -ItemType Directory `
            -Path $env:RCLONE_DIR `
            -Force | Out-Null

          $config = @"
          [b2]
          type = s3
          provider = Other
          access_key_id = $env:B2_KEY_ID
          secret_access_key = $env:B2_APPLICATION_KEY
          endpoint = $env:B2_ENDPOINT
          region = auto
          acl = private
          "@

          Set-Content `
            -Path $env:RCLONE_CONFIG `
            -Value $config `
            -Encoding UTF8

          # Chỉ lưu tên bucket/path vào GITHUB_ENV,
          # không lưu secret.
          "B2_REMOTE=b2:$env:B2_BUCKET/rdp-profile" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "Backblaze configuration created."


      # ============================================================
      # 3. Test kết nối B2
      # ============================================================
      - name: Test Backblaze connection
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Testing Backblaze B2..."

          & "$env:RCLONE_DIR\rclone.exe" `
            lsd "b2:$env:B2_BUCKET"

          if ($LASTEXITCODE -ne 0) {
            throw "Cannot connect to Backblaze B2"
          }

          Write-Host "Backblaze B2 connection OK."


      # ============================================================
      # 4. Tạo / cập nhật tài khoản RDP
      # ============================================================
      - name: Create RDP user
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:RDP_PASSWORD) {
            throw "RDP_PASSWORD is missing"
          }

          $securePassword =
            ConvertTo-SecureString `
              $env:RDP_PASSWORD `
              -AsPlainText `
              -Force

          $user =
            Get-LocalUser `
              -Name "RDP" `
              -ErrorAction SilentlyContinue

          if (-not $user) {

            New-LocalUser `
              -Name "RDP" `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires

            Write-Host "Created RDP user."

          } else {

            Set-LocalUser `
              -Name "RDP" `
              -Password $securePassword

            Write-Host "Updated RDP password."
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          # Cho phép admin nếu cần cài phần mềm / thao tác hệ thống.
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          Write-Host "RDP account ready."


      # ============================================================
      # 5. Bật Windows RDP
      # ============================================================
      - name: Configure Windows RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Restart-Service `
            -Name TermService `
            -Force

          Write-Host "RDP enabled."


      # ============================================================
      # 6. RESTORE profile từ Backblaze
      # ============================================================
      - name: Restore RDP profile
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Path $env:PROFILE `
            -Force | Out-Null

          Write-Host "Checking previous backup..."

          & "$env:RCLONE_DIR\rclone.exe" `
            lsf "$env:B2_REMOTE" `
            --max-depth 1

          if ($LASTEXITCODE -eq 0) {

            Write-Host ""
            Write-Host "======================================"
            Write-Host " Previous RDP backup detected"
            Write-Host " Restoring..."
            Write-Host "======================================"

            & "$env:RCLONE_DIR\rclone.exe" `
              sync `
              "$env:B2_REMOTE" `
              "$env:PROFILE" `
              --transfers 8 `
              --checkers 16 `
              --multi-thread-streams 4 `
              --retries 5 `
              --low-level-retries 10 `
              --stats 30s `
              --progress

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Some files could not be restored."
            } else {
              Write-Host "Restore completed."
            }

          } else {

            Write-Host "No previous backup found."
            Write-Host "Starting with a new RDP profile."
          }


      # ============================================================
      # 7. Sửa quyền profile
      # ============================================================
      - name: Fix RDP profile permissions
        shell: powershell
        run: |
          if (Test-Path $env:PROFILE) {

            Write-Host "Fixing RDP profile permissions..."

            icacls `
              $env:PROFILE `
              /inheritance:e `
              /grant "RDP:(OI)(CI)F" `
              /T `
              /C

          }


      # ============================================================
      # 8. Cài Tailscale
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Tailscale installed."


      # ============================================================
      # 9. Kết nối Tailscale
      # ============================================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:TAILSCALE_AUTHKEY) {
            throw "TAILSCALE_AUTHKEY is missing"
          }

          $tailscale =
            "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="gh-rdp-$env:GITHUB_RUN_ID"

          Start-Sleep -Seconds 5

          $ip = & $tailscale ip -4 |
            Select-Object -First 1

          if (-not $ip) {
            throw "Tailscale IPv4 address was not assigned."
          }

          "TAILSCALE_IP=$ip" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host ""
          Write-Host "======================================"
          Write-Host "          RDP CONNECTION"
          Write-Host "======================================"
          Write-Host "Address : $ip"
          Write-Host "User    : RDP"
          Write-Host "Password: GitHub Secret RDP_PASSWORD"
          Write-Host "======================================"
          Write-Host ""


      # ============================================================
      # 10. Hiển thị CPU / RAM / GPU
      # ============================================================
      - name: Show hardware
        shell: powershell
        run: |
          Write-Host "===== CPU ====="

          Get-CimInstance Win32_Processor |
            Select-Object `
              Name,
              NumberOfCores,
              NumberOfLogicalProcessors

          Write-Host ""
          Write-Host "===== RAM ====="

          $ram =
            Get-CimInstance Win32_ComputerSystem

          Write-Host (
            "RAM: {0:N2} GB" -f
            ($ram.TotalPhysicalMemory / 1GB)
          )

          Write-Host ""
          Write-Host "===== GPU ====="

          Get-CimInstance Win32_VideoController |
            Select-Object `
              Name,
              DriverVersion,
              AdapterRAM


      # ============================================================
      # 11. Download Downloads.bat
      # ============================================================
      - name: Install Downloads.bat
        shell: powershell
        run: |
          $startup =
            "$env:PROFILE\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"

          New-Item `
            -ItemType Directory `
            -Path $startup `
            -Force | Out-Null

          $url =
            "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"

          $target =
            "$startup\Downloads.bat"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $target

          Write-Host "Downloads.bat installed."


      # ============================================================
      # 12. Giữ runner online cho RDP
      # ============================================================
      - name: Keep RDP alive
        shell: powershell
        run: |
          # Dành khoảng 20 phút cuối cho backup.
          $end =
            (Get-Date).AddMinutes(330)

          Write-Host ""
          Write-Host "======================================"
          Write-Host " RDP SERVER IS READY"
          Write-Host " Tailscale IP: $env:TAILSCALE_IP"
          Write-Host " User: RDP"
          Write-Host "======================================"
          Write-Host ""

          while ((Get-Date) -lt $end) {

            Write-Host (
              "[{0}] RDP ACTIVE" -f (Get-Date)
            )

            Start-Sleep -Seconds 300
          }

          Write-Host "RDP time finished."


      # ============================================================
      # 13. BACKUP toàn bộ C:\Users\RDP
      # ============================================================
      - name: Backup RDP profile to Backblaze
        if: always()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host " BACKING UP RDP PROFILE"
          Write-Host "======================================"

          if (-not (Test-Path $env:PROFILE)) {

            Write-Warning `
              "RDP profile does not exist."

            exit 0
          }

          # Loại bỏ một số cache/temp không cần thiết
          # để giảm dung lượng backup.
          $exclude = @(
            "--exclude", "AppData/Local/Temp/**",
            "--exclude", "AppData/Local/Microsoft/Edge/User Data/Default/Cache/**",
            "--exclude", "AppData/Local/Google/Chrome/User Data/Default/Cache/**"
          )

          & "$env:RCLONE_DIR\rclone.exe" `
            sync `
            "$env:PROFILE" `
            "$env:B2_REMOTE" `
            --transfers 8 `
            --checkers 16 `
            --multi-thread-streams 4 `
            --retries 10 `
            --low-level-retries 20 `
            --retries-sleep 5s `
            --fast-list `
            --stats 30s `
            --progress `
            @exclude

          if ($LASTEXITCODE -ne 0) {

            Write-Warning `
              "Backup finished with some errors."

          } else {

            Write-Host ""
            Write-Host "======================================"
            Write-Host " BACKUP COMPLETED SUCCESSFULLY"
            Write-Host "======================================"
          }


      # ============================================================
      # 14. Hiển thị thông tin backup
      # ============================================================
      - name: Verify backup
        if: always()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "===== BACKUP CONTENT ====="

          & "$env:RCLONE_DIR\rclone.exe" `
            size "$env:B2_REMOTE"

          Write-Host ""
          Write-Host "RDP profile backup location:"
          Write-Host "$env:B2_REMOTE"
