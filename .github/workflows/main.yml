name: GCP GPU PC - RDP + Tailscale

on:
  workflow_dispatch:

jobs:
  gpu-pc:
    runs-on: self-hosted
    timeout-minutes: 360

    steps:

      - name: Check GPU
        shell: powershell
        run: |
          Write-Host "===== GPU ====="

          if (Get-Command nvidia-smi -ErrorAction SilentlyContinue) {
              nvidia-smi
          }
          else {
              Write-Error "NVIDIA driver / nvidia-smi not found."
              exit 1
          }

      - name: Install Tailscale
        shell: powershell
        run: |
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" `
            -OutFile $installer

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

          Remove-Item $installer -Force

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              throw "Missing TAILSCALE_AUTH_KEY"
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="gcp-gpu-$env:GITHUB_RUN_ID" `
            --accept-dns=false

          Start-Sleep -Seconds 5

          $ip = & $ts ip -4 |
            Where-Object { $_ -match '^100\.' } |
            Select-Object -First 1

          if (!$ip) {
              throw "Tailscale IP not found."
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections `
            -Value 0

          Set-Service `
            TermService `
            -StartupType Automatic

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Restart-Service `
            TermService `
            -Force

      - name: Verify RDP
        shell: powershell
        run: |
          Write-Host "===== TAILSCALE IP ====="
          Write-Host $env:TAILSCALE_IP

          Write-Host ""
          Write-Host "===== GPU ====="
          nvidia-smi

          Write-Host ""
          Write-Host "===== RDP ====="

          Test-NetConnection `
            127.0.0.1 `
            -Port 3389

          Write-Host ""
          Write-Host "===== TAILSCALE RDP ====="

          Test-NetConnection `
            $env:TAILSCALE_IP `
            -Port 3389

      - name: Connection information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          GCP GPU PC READY"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Tailscale IP:"
          Write-Host $env:TAILSCALE_IP

          Write-Host ""
          Write-Host "RDP address:"
          Write-Host "$env:TAILSCALE_IP`:3389"

          Write-Host ""
          Write-Host "GPU:"
          nvidia-smi

          Write-Host ""
          Write-Host "=========================================="

      - name: Keep runner alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] GCP GPU PC running"
              Write-Host "Tailscale: $env:TAILSCALE_IP"
              Start-Sleep -Seconds 60
          }
