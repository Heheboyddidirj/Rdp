name: Windows RDP + Tailscale + Backblaze B2 Auto Backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    env:
      PROFILE: C:\Users\RDP
      RCLONE_DIR: C:\rclone
      RCLONE_CONFIG: C:\rclone\rclone.conf

    steps:

      # ============================================================
      # 1. Cài rclone
      # ============================================================
      - name: Install rclone
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory `
            -Path $env:RCLONE_DIR `
            -Force | Out-Null

          $zip = "$env:TEMP\rclone.zip"

          Invoke-WebRequest `
            -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" `
            -OutFile $zip

          Expand-Archive `
            -Path $zip `
            -DestinationPath "$env:TEMP\rclone_extract" `
            -Force

          $exe = Get-ChildItem `
            "$env:TEMP\rclone_extract" `
            -Filter "rclone.exe" `
            -Recurse |
            Select-Object -First 1

          Copy-Item `
            $exe.FullName `
            "$env:RCLONE_DIR\rclone.exe" `
            -Force

          & "$env:RCLONE_DIR\rclone.exe" version


      # ============================================================
      # 2. Cấu hình Backblaze
      # ============================================================
      - name: Configure Backblaze B2
        shell: powershell
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory `
            -Path $env:RCLONE_DIR `
            -Force | Out-Null

          $config = @"
          [b2]
          type = s3
          provider = Other
          access_key_id = $env:B2_KEY_ID
          secret_access_key = $env:B2_APPLICATION_KEY
          endpoint = $env:B2_ENDPOINT
          acl = private
          "@

          Set-Content `
            -Path $env:RCLONE_CONFIG `
            -Value $config `
            -Encoding UTF8

          "B2_BUCKET_REMOTE=b2:$env:B2_BUCKET" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "Backblaze configured."


      # ============================================================
      # 3. Kiểm tra B2
      # ============================================================
      - name: Test Backblaze B2
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Testing Backblaze B2..."

          & "$env:RCLONE_DIR\rclone.exe" `
            lsf "$env:B2_BUCKET_REMOTE" `
            --max-depth 1

          if ($LASTEXITCODE -ne 0) {
            throw "Cannot access Backblaze B2."
          }

          Write-Host "Backblaze B2 connection OK."


      # ============================================================
      # 4. Tạo tài khoản RDP
      # ============================================================
      - name: Create RDP user
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $securePassword =
            ConvertTo-SecureString `
              $env:RDP_PASSWORD `
              -AsPlainText `
              -Force

          $user =
            Get-LocalUser `
              -Name "RDP" `
              -ErrorAction SilentlyContinue

          if (-not $user) {

            New-LocalUser `
              -Name "RDP" `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires

          } else {

            Set-LocalUser `
              -Name "RDP" `
              -Password $securePassword
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user ready."


      # ============================================================
      # 5. Bật RDP
      # ============================================================
      - name: Configure Windows RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Restart-Service `
            -Name TermService `
            -Force

          Write-Host "RDP enabled."


      # ============================================================
      # 6. Restore dữ liệu cũ
      # ============================================================
      - name: Restore RDP profile
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory `
            -Path $env:PROFILE `
            -Force | Out-Null

          $remote = "$env:B2_BUCKET_REMOTE/rdp-profile"

          Write-Host "Checking previous backup..."

          & "$env:RCLONE_DIR\rclone.exe" `
            lsf "$remote" `
            --max-depth 1

          if ($LASTEXITCODE -eq 0) {

            Write-Host "Previous backup found."
            Write-Host "Restoring..."

            & "$env:RCLONE_DIR\rclone.exe" `
              sync `
              "$remote" `
              "$env:PROFILE" `
              --transfers 8 `
              --checkers 16 `
              --retries 5 `
              --low-level-retries 10 `
              --stats 30s `
              --progress

            if ($LASTEXITCODE -ne 0) {
              throw "Restore failed."
            }

            Write-Host "Restore completed."

          } else {

            Write-Host "No previous backup found."
            Write-Host "Starting new profile."
          }


      # ============================================================
      # 7. Sửa quyền profile
      # ============================================================
      - name: Fix profile permissions
        shell: powershell
        run: |
          if (Test-Path $env:PROFILE) {

            icacls `
              $env:PROFILE `
              /inheritance:e `
              /grant "RDP:(OI)(CI)F" `
              /T `
              /C
          }


      # ============================================================
      # 8. Cài Tailscale
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue


      # ============================================================
      # 9. Kết nối Tailscale
      # ============================================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $tailscale =
            "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="gh-rdp-$env:GITHUB_RUN_ID"

          Start-Sleep -Seconds 5

          $ip =
            & $tailscale ip -4 |
            Select-Object -First 1

          if (-not $ip) {
            throw "Tailscale IP was not assigned."
          }

          "TAILSCALE_IP=$ip" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host ""
          Write-Host "======================================"
          Write-Host " RDP READY"
          Write-Host " Address : $ip"
          Write-Host " Username: RDP"
          Write-Host "======================================"
          Write-Host ""


      # ============================================================
      # 10. Auto backup mỗi 5 phút
      # ============================================================
      - name: Start automatic 5-minute backup
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $scriptPath = "C:\rclone\auto-backup.ps1"

          @'
          $ErrorActionPreference = "Continue"

          $profile = "C:\Users\RDP"
          $rclone = "C:\rclone\rclone.exe"
          $remote = "$env:B2_BUCKET_REMOTE/rdp-profile"

          while ($true) {

              Write-Host ""
              Write-Host "======================================"
              Write-Host " AUTO BACKUP START"
              Write-Host "$(Get-Date)"
              Write-Host "======================================"

              if (Test-Path $profile) {

                  & $rclone sync `
                    $profile `
                    $remote `
                    --transfers 8 `
                    --checkers 16 `
                    --retries 3 `
                    --low-level-retries 5 `
                    --stats 30s `
                    --exclude "AppData/Local/Temp/**" `
                    --exclude "AppData/Local/Microsoft/Edge/User Data/Default/Cache/**" `
                    --exclude "AppData/Local/Google/Chrome/User Data/Default/Cache/**"

                  if ($LASTEXITCODE -eq 0) {
                      Write-Host "AUTO BACKUP SUCCESS"
                  } else {
                      Write-Host "AUTO BACKUP ERROR - will retry."
                  }

              } else {

                  Write-Host "Profile does not exist yet."
              }

              Write-Host "Next backup in 5 minutes."

              Start-Sleep -Seconds 300
          }
          '@ |
            Set-Content `
              -Path $scriptPath `
              -Encoding UTF8

          $env:B2_BUCKET_REMOTE |
            Out-File `
              -FilePath "C:\rclone\b2remote.txt" `
              -Encoding utf8

          Start-Process `
            powershell.exe `
            -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File `"$scriptPath`"" `
            -WindowStyle Hidden

          Write-Host "Automatic 5-minute backup started."


      # ============================================================
      # 11. Giữ RDP hoạt động
      # ============================================================
      - name: Keep RDP alive
        shell: powershell
        run: |
          $end = (Get-Date).AddMinutes(330)

          Write-Host ""
          Write-Host "======================================"
          Write-Host " RDP SERVER ACTIVE"
          Write-Host " IP: $env:TAILSCALE_IP"
          Write-Host " Backup: EVERY 5 MINUTES"
          Write-Host "======================================"
          Write-Host ""

          while ((Get-Date) -lt $end) {

            Write-Host "[$(Get-Date)] RDP ACTIVE - Auto backup running"

            Start-Sleep -Seconds 300
          }

          Write-Host "RDP session time finished."


      # ============================================================
      # 12. Backup cuối cùng
      # ============================================================
      - name: Final backup
        if: always()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host " FINAL BACKUP"
          Write-Host "======================================"

          $remote = "$env:B2_BUCKET_REMOTE/rdp-profile"

          if (Test-Path $env:PROFILE) {

            & "$env:RCLONE_DIR\rclone.exe" `
              sync `
              "$env:PROFILE" `
              "$remote" `
              --transfers 8 `
              --checkers 16 `
              --retries 10 `
              --low-level-retries 20 `
              --retries-sleep 5s `
              --stats 30s `
              --progress `
              --exclude "AppData/Local/Temp/**" `
              --exclude "AppData/Local/Microsoft/Edge/User Data/Default/Cache/**" `
              --exclude "AppData/Local/Google/Chrome/User Data/Default/Cache/**"

            if ($LASTEXITCODE -eq 0) {

              Write-Host ""
              Write-Host "======================================"
              Write-Host " FINAL BACKUP SUCCESS"
              Write-Host "======================================"

            } else {

              Write-Warning "Final backup encountered errors."
            }

          } else {

            Write-Warning "RDP profile does not exist."
          }


      # ============================================================
      # 13. Kiểm tra backup
      # ============================================================
      - name: Verify backup
        if: always()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "===== B2 BACKUP SIZE ====="

          & "$env:RCLONE_DIR\rclone.exe" `
            size "$env:B2_BUCKET_REMOTE/rdp-profile"
