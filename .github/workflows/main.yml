name: RDP + Moonlight (Sunshine)

on:
  workflow_dispatch:

jobs:
  remote-pc:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'SecurityLayer' -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP user
        shell: powershell
        run: |
          $upper=[char[]](65..90); $lower=[char[]](97..122); $number=[char[]](48..57)
          $special=[char[]](33..47)+[char[]](58..64)+[char[]](91..96)+[char[]](123..126)
          $raw=@()
          $raw += $upper|Get-Random -Count 4
          $raw += $lower|Get-Random -Count 4
          $raw += $number|Get-Random -Count 4
          $raw += $special|Get-Random -Count 4
          $password=-join($raw|Sort-Object{Get-Random})
          $secure=ConvertTo-SecureString $password -AsPlainText -Force
          if(Get-LocalUser -Name RDP -ErrorAction SilentlyContinue){Remove-LocalUser RDP}
          New-LocalUser -Name RDP -Password $secure -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group Administrators -Member RDP
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member RDP
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        shell: powershell
        run: |
          $url="https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $file="$env:TEMP\tailscale.msi"
          Invoke-WebRequest $url -OutFile $file
          Start-Process msiexec.exe -ArgumentList "/i","`"$file`"","/quiet","/norestart" -Wait
          Remove-Item $file -Force

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)){
            Write-Error "Missing repository secret TAILSCALE_AUTH_KEY"; exit 1
          }
          $ts="$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --authkey="$env:TAILSCALE_AUTH_KEY" --hostname="gh-moonlight-$env:GITHUB_RUN_ID"
          $ip=$null
          for($i=0;$i -lt 20;$i++){
            $candidate=(& $ts ip -4 2>$null|Select-Object -First 1).Trim()
            if($candidate -match '^100\.(\d{1,3}\.){2}\d{1,3}$'){$ip=$candidate;break}
            Start-Sleep 3
          }
          if(-not $ip){Write-Error "Tailscale IPv4 not found";exit 1}
          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP: $ip"

      - name: Check GPU
        shell: powershell
        run: |
          Write-Host "=== GPU ==="
          Get-CimInstance Win32_VideoController |
            Select-Object Name,DriverVersion,VideoProcessor,AdapterRAM |
            Format-List

      - name: Install Sunshine
        shell: powershell
        run: |
          # Stable Sunshine release. The official Windows package is AMD64/x64.
          $version="v2026.516.143833"
          $url="https://github.com/LizardByte/Sunshine/releases/download/$version/Sunshine-Windows-AMD64-installer.exe"
          $file="$env:TEMP\Sunshine-Installer.exe"
          Invoke-WebRequest $url -OutFile $file
          Start-Process $file -ArgumentList "/S" -Wait
          Remove-Item $file -Force -ErrorAction SilentlyContinue
          $sun="C:\Program Files\Sunshine\sunshine.exe"
          if(-not(Test-Path $sun)){Write-Error "Sunshine was not installed";exit 1}
          "SUNSHINE_EXE=$sun" >> $env:GITHUB_ENV

      - name: Configure Sunshine
        shell: powershell
        run: |
          $dir="C:\Program Files\Sunshine\config"
          New-Item -ItemType Directory -Path $dir -Force|Out-Null
          @"
          sunshine_name = GitHub-Moonlight
          port = 47989
          address_family = ipv4
          bind_address = $env:TAILSCALE_IP
          origin_web_ui_allowed = wan
          csrf_allowed_origins = https://$env:TAILSCALE_IP:47990
          lan_encryption_mode = 1
          wan_encryption_mode = 1
          max_bitrate = 0
          minimum_fps_target = 30
          hevc_mode = 0
          av1_mode = 0
          "@ | Set-Content "$dir\sunshine.conf" -Encoding UTF8

      - name: Set Sunshine Web credentials
        shell: powershell
        run: |
          $bytes=New-Object byte[] 18
          [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
          $pass=[Convert]::ToBase64String($bytes).Replace("+","A").Replace("/","B").Replace("=","C")
          & $env:SUNSHINE_EXE --creds "moonlight" "$pass"
          "SUNSHINE_USER=moonlight" >> $env:GITHUB_ENV
          "SUNSHINE_PASSWORD=$pass" >> $env:GITHUB_ENV

      - name: Configure Sunshine firewall
        shell: powershell
        run: |
          netsh advfirewall firewall delete rule name="Sunshine-Tailscale-TCP" 2>$null
          netsh advfirewall firewall delete rule name="Sunshine-Tailscale-UDP" 2>$null
          netsh advfirewall firewall add rule name="Sunshine-Tailscale-TCP" dir=in action=allow protocol=TCP localport=47984,47989,47990,48010 profile=any
          netsh advfirewall firewall add rule name="Sunshine-Tailscale-UDP" dir=in action=allow protocol=UDP localport=47998,47999,48000,48002 profile=any

      - name: Start Sunshine
        shell: powershell
        run: |
          $service=Get-Service -Name Sunshine -ErrorAction SilentlyContinue
          if($service){
            Set-Service Sunshine -StartupType Automatic
            Start-Service Sunshine -ErrorAction SilentlyContinue
            Start-Sleep 8
          }
          if(-not(Get-Process sunshine -ErrorAction SilentlyContinue)){
            Start-Process $env:SUNSHINE_EXE -WorkingDirectory "C:\Program Files\Sunshine" -WindowStyle Hidden
            Start-Sleep 8
          }
          if(-not(Get-Process sunshine -ErrorAction SilentlyContinue)){
            Write-Error "Sunshine is not running";exit 1
          }

      - name: Verify Sunshine
        shell: powershell
        run: |
          Start-Sleep 5
          Write-Host "=== Sunshine TCP listeners ==="
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
            Where-Object {$_.LocalPort -in 47984,47989,47990,48010} |
            Select-Object LocalAddress,LocalPort,State
          Write-Host "=== Web UI test ==="
          Test-NetConnection $env:TAILSCALE_IP -Port 47990

      - name: Show connection information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " GITHUB PC - MOONLIGHT / SUNSHINE"
          Write-Host "=============================================="
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "RDP address  : $env:TAILSCALE_IP`:3389"
          Write-Host "RDP user     : RDP"
          Write-Host "RDP password : $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "Sunshine Web : https://$env:TAILSCALE_IP`:47990"
          Write-Host "Sunshine user: $env:SUNSHINE_USER"
          Write-Host "Sunshine pass: $env:SUNSHINE_PASSWORD"
          Write-Host ""
          Write-Host "Add the Tailscale IP in Moonlight."
          Write-Host "Use the Sunshine Web UI to complete PIN pairing."
          Write-Host "=============================================="

      - name: Keep PC alive
        shell: powershell
        run: |
          while($true){
            if(-not(Get-Process sunshine -ErrorAction SilentlyContinue)){
              Start-Process $env:SUNSHINE_EXE -WorkingDirectory "C:\Program Files\Sunshine" -WindowStyle Hidden
            }
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] PC active | $env:TAILSCALE_IP"
            Start-Sleep 60
          }
